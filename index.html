<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casian Fitness Log</title>
<meta name="description" content="Weekly training plan, personal records and meal tracking with label scanning, stored on your phone.">
<meta name="theme-color" content="#EDF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1211" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column; sticky header carries the week or day; fixed bottom tab bar; training days read like a printed session sheet with paired moves bracketed together */
:root{
  --bg:#EDF0EE;
  --surface:#FFFFFF;
  --sunk:#E3E8E5;
  --ink:#141D1A;
  --muted:#58655F;
  --line:#D1D9D5;
  --accent:#2446C4;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCE3FA;
  --gold:#946800;
  --gold-soft:#F5E8C2;
  --danger:#B3261E;
  --c-p:#2446C4;
  --c-c:#2C8770;
  --c-f:#B3741A;
  --shadow:rgba(10,20,16,.08);
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1211; --surface:#161D1B; --sunk:#0A0E0D; --ink:#E4EBE8; --muted:#97A39E; --line:#2A3431;
    --accent:#8DA4FF; --accent-ink:#0A1233; --accent-soft:#1D2950; --gold:#E6B84C; --gold-soft:#3A3017;
    --danger:#F2877F; --c-p:#8DA4FF; --c-c:#5BC4A6; --c-f:#E3A955; --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:620px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.row.nowrap .txt{flex:1}
.row.tight{gap:2px}
.min0{min-width:0}
.hint{margin:0;font-size:14px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.center{text-align:center}
.err{margin:0;color:var(--danger);font-size:14px;font-weight:500}
.dim{color:var(--muted)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 12px;border-bottom:1px solid var(--line)}
.top-grid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top-right{display:flex;align-items:center;gap:2px;padding-bottom:2px;margin-right:-8px}
.eyebrow{font:600 12px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.title-row{display:flex;align-items:center;gap:0;margin:2px 0 0 -8px}
.title-row.nonav{margin-left:0}
.h-title{margin:0;font:700 34px/1 var(--font-display);letter-spacing:.005em;text-wrap:balance;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px;margin-top:2px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.link{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:600 14px var(--font-body)}
.status{font:600 11.5px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;padding-right:2px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-c)}
.status[data-state="busy"]::before{background:var(--muted)}
.status[data-state="err"]{color:var(--danger)}
.status[data-state="err"]::before{background:var(--danger)}
.icon-btn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}

/* Main + tab bar */
main{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px var(--font-body);letter-spacing:.07em;text-transform:uppercase}
.tab[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:600 14px var(--font-body);max-width:calc(100% - 32px);width:max-content;text-align:center;box-shadow:0 6px 20px var(--shadow)}

/* Buttons and fields */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:600 15px/1.2 var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 10px;font-size:14px}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--ink);width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;flex:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn.sm{width:34px;height:34px;color:var(--muted)}
.icon-btn[disabled]{opacity:.3;cursor:default}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font:600 11px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fld>span .chip{letter-spacing:.05em}
.fld>span .u{text-transform:none;letter-spacing:0}
.txt{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font:500 16px var(--font-body);color:var(--ink)}
textarea.txt{min-height:76px;resize:vertical;line-height:1.4}
.txt.from-scan{background:var(--gold-soft);border-color:var(--gold)}
.txt.from-check{border-color:var(--danger);border-width:2px}
.chip.danger{background:var(--danger);color:#fff}
.num{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 4px;text-align:center;font:700 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.num::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.check{display:flex;align-items:center;gap:8px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3,.block h3{margin:0;font:700 21px/1.1 var(--font-display);letter-spacing:.01em}
.card h4{margin:0;font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.notice{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.notice .hint{color:var(--ink)}
.empty{padding:20px 16px;color:var(--muted);font-size:15px}
.empty strong{display:block;color:var(--ink);font:700 21px/1.15 var(--font-display);margin-bottom:4px}
.card .empty{padding:0}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--sunk);font-size:15px}
.form-block{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.tag{font:700 10.5px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--ink);color:var(--bg);flex:none}
.tag.soft{background:var(--sunk);color:var(--muted)}
.chip{font:700 10.5px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);vertical-align:2px}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.welcome h2{margin:0;font:700 30px/1.05 var(--font-display);text-wrap:balance}
.welcome p{margin:0;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-top:1px solid var(--line);padding-top:10px}
.kv span{color:var(--muted);flex:none}
.kv b{text-align:right;font-weight:600;min-width:0}
.panel{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:10px;background:var(--sunk)}
.panel .txt{background:var(--surface)}
.panel .txt.from-scan{background:var(--gold-soft)}

/* Train */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);min-width:0}
.d-name{font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.d-num{font:700 21px/1 var(--font-display);font-variant-numeric:tabular-nums}
.day.rest .d-num{color:var(--muted)}
.day.today{border-color:var(--ink);border-width:2px;padding:7px 0 6px}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel .d-name,.day.sel .d-num{color:inherit}
.day.sel .d-name{opacity:.75}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dayhead h2{margin:0;font:700 27px/1.05 var(--font-display)}
.daynote{margin:-4px 0 0;font-size:14px;color:var(--muted)}
.restnote{margin:-6px 0 0;font-size:13.5px;color:var(--muted)}
.ex{padding:14px;display:flex;gap:12px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.ex-name{font:600 17px/1.25 var(--font-body);display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere;flex-wrap:wrap}
.ex-meta{font-size:13.5px;color:var(--muted);white-space:nowrap}
.ex-note{font-size:13.5px;color:var(--muted)}
.ab{flex:none;width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/26px var(--font-display);text-align:center;margin-top:1px}
.pair{border-top:1px solid var(--line);border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface))}
.pair:first-child{border-top:0}
.pair-head{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:10px 14px 0}
.pair .ex{border-top:1px dashed var(--line)}
.pair .ex:first-of-type{border-top:0}
.lr{padding:16px;display:flex;flex-direction:column;gap:10px}
.lr-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lr-km{font:700 54px/.95 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lr-unit{font:600 16px var(--font-display);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lr-kind{font:700 14px var(--font-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.lr-kind.easy{background:var(--c-c);color:#fff}
.lr-why{font-size:15px}
.lr-splits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lr-split{padding:10px;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;gap:2px;min-width:0}
.lr-split b{font:700 20px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.lr-split span{font-size:12.5px;color:var(--muted)}
.lr-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.block{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.pe{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pe:first-child{border-top:0}
.pe-grid{display:grid;grid-template-columns:minmax(0,1fr) 4.5rem;gap:8px}
.checks{display:flex;gap:14px;flex-wrap:wrap}

/* Records */
.pr-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pr-name{font:700 23px/1.05 var(--font-display)}
.pr-test{font-size:13.5px;color:var(--muted);margin-top:3px}
.spark{flex:none;overflow:visible}
.pr-best{display:flex;align-items:baseline;gap:6px}
.big{font:700 54px/.95 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.unit{font:600 16px var(--font-display);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.delta{font-size:14px;color:var(--muted);margin-top:4px}
.delta b{color:var(--gold);font-weight:700}
.hist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.hist li{display:grid;grid-template-columns:6.2em 4.6em minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.h-when{color:var(--muted);font-variant-numeric:tabular-nums}
.h-val{font:700 18px var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.h-val.is-pr::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:2px}
.h-note{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.legend{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.run-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.grams-row{display:grid;grid-template-columns:minmax(0,8rem) minmax(0,1fr);gap:12px;align-items:end}

/* Food */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:9px;font:600 15px var(--font-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.kcal-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.of{color:var(--muted);font-size:15px}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.m-name{font:600 11px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.m-val{font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.m-val small{font:500 13px var(--font-body);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;border-radius:3px}
.details{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.details li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-variant-numeric:tabular-nums}
.details li span:first-child{color:var(--muted)}
.details li.head{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:0;padding-top:12px;padding-bottom:2px}
.details b{font-weight:600}
.details small{color:var(--muted);font-size:12.5px;margin-left:6px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.meal-tot{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.it-name{grid-column:1;grid-row:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.it-g{font-weight:500;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.it-mac{grid-column:1;grid-row:2;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.items .icon-btn{grid-column:2;grid-row:1 / span 2}
.picker{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.pick-sel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.pick-sel .it-mac{margin-top:2px}
.ing-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.ing-opt{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--ink)}
.ing-opt .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ing-opt .m{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.preview{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.preview b{font:700 22px var(--font-display);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ing-row{appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 14px;color:var(--ink)}
.ing-row:first-child{border-top:0}
.ing-row .n{font-weight:600;overflow-wrap:anywhere}
.ing-row .m{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ing-row.sel{background:var(--accent-soft)}
.scan{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--sunk)}
.scan-status{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.scan-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.scan-bar>span{display:block;height:100%;background:var(--accent)}
.crop-stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px;overflow:hidden;background:#111;line-height:0;scroll-margin-top:calc(140px + env(safe-area-inset-top,0px))}
.crop-stage img{display:block;width:100%;height:auto;max-width:100%}
.crop-box{position:absolute;border:2px solid var(--gold);box-shadow:0 0 0 4000px rgba(0,0,0,.5);box-sizing:border-box;cursor:move}
.crop-h{position:absolute;width:48px;height:48px;margin:-24px;display:grid;place-items:center;cursor:pointer}

function openIdb(){

function idbKV(h){
  function tx(fn){return new Promise(function(res,rej){var t=h.transaction('docs','readwrite');fn(t.objectStore('docs'));t.oncomplete=function(){res();};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error||new Error('aborted'));};});}

    all:function(){return new Promise(function(res,rej){var out={},t=h.transaction('docs','readonly'),req=t.objectStore('docs').openCursor();req.onsuccess=function(){var c=req.result;if(c){out[c.key]=c.value;c.continue();}};t.oncomplete=function(){res(out);};t.onerror=function(){rej(t.error);};});},
    put:function(k,v){return tx(function(st){st.put(v,k);});},
    del:function(k){return tx(function(st){st.delete(k);});},
    replaceAll:function(docs){return tx(function(st){st.clear();Object.keys(docs).forEach(function(k){st.put(docs[k],k);});});}
  };
}

function flush(path){

  var p=job.op==='set'?KV.put(path,job.data):KV.del(path);
  p.then(function(){writeErr=null;},function(e){

/* ---------- backup ---------- */
function downloadBlob(blob,name){
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},2000);
}
function exportBackup(){
  flushAll();
  var data={app:APP_ID,schema:1,exportedAt:new Date().toISOString(),docs:allDocs()};
  var name='fitness-log-backup-'+todayY()+'.json',blob=new Blob([JSON.stringify(data)],{type:'application/json'}),file=null;
  try{file=new File([blob],name,{type:'application/json'});}catch(e){}
  function done(){setMeta({lastBackup:data.exportedAt});toast('Backup saved');render();}
  if(isIOS()&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(done).catch(function(err){
      if(err&&err.name==='AbortError')return;
      downloadBlob(blob,name);done();
    });
    return;
  }
  downloadBlob(blob,name);done();
}
$file.addEventListener('change',function(){
  var f=$file.files&&$file.files[0];
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    $file.value='';
    var d=null;try{d=JSON.parse(rd.result);}catch(e){}
    if(!d||d.app!==APP_ID||!d.docs||typeof d.docs!=='object'){toast('That file is not a backup from this app.',4000);return;}
    var docs={};
    Object.keys(d.docs).forEach(function(p){var v=d.docs[p];if(validPath(p)&&v&&typeof v==='object'&&!Array.isArray(v))docs[p]=v;});
    if(!Object.keys(docs).length){toast('That backup is empty.',4000);return;}
    UI.importPending={docs:docs,exportedAt:d.exportedAt||null};render();window.scrollTo(0,0);
  };
  rd.onerror=function(){$file.value='';toast('Could not open that file.',4000);};
  rd.readAsText(f);
});

function blockStartD(){var b=S.settings&&S.settings.blockStart;return b?mondayOf(parseYmd(b)):null;}

  if(!S.plan)S.plan={v:2,restNote:'',days:{}};

function exMeta(ex){
  var n=parseInt(ex.sets,10);
  if(ex.type==='run')return '';

  return n>0?n+(n===1?' set':' sets'):'';

/* Long run: easy on weeks you add distance, 60/30/10 on weeks you repeat one, from the last run you confirmed */
function longRunSchedule(d){
  var lr=S.settings&&S.settings.longRun;
  if(!lr||!lr.date||!(lr.km>0))return null;
  var anchor=sundayOf(parseYmd(lr.date)),sun=sundayOf(d);
  var n=Math.round((sun-anchor)/604800000),i0=lr.kind==='easy'?0:1,idx=i0+n,step=lr.step>0?lr.step:1;
  var km=r2(lr.km+Math.floor(idx/2)*step),kind=((idx%2)+2)%2===0?'easy':'6030';
  return {km:km,kind:kind,n:n,step:step,prevKm:r2(km-step),sunday:sun,anchor:anchor,lr:lr};
}

/* ---------- records model ---------- */
function prVal(pr,x){return pr.type==='run'?(x.km||0):(x.value||0);}
function prBest(pr){
  var h=pr.history||[],b=null;
  h.forEach(function(x){
    if(!b){b=x;return;}
    var v=prVal(pr,x),bv=prVal(pr,b);
    if(v>bv)b=x;
    else if(pr.type==='run'&&v===bv&&x.sec&&(!b.sec||x.sec<b.sec))b=x;
  });
  return b;
}
function sortHist(pr){
  var h=(pr.history||[]).map(function(x,i){return [x,i];});
  h.sort(function(a,b){var da=a[0].date||'',dbb=b[0].date||'';return da<dbb?-1:da>dbb?1:a[1]-b[1];});
  pr.history=h.map(function(p){return p[0];});
}
function whenLabel(x){if(x.date)return fmtDate(parseYmd(x.date));if(x.week)return 'Week '+x.week;return 'Earlier';}
function noteFor(pr,x){
  if(pr.type==='run')return [x.sec?fmtDur(x.sec)+', '+paceStr(x.km,x.sec):'',x.note||''].filter(Boolean).join('. ');
  return x.note||'';
}
function spark(vals){
  if(vals.length<2)return '';
  var W=112,H=38,P=4,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
  var pts=vals.map(function(v,i){return [P+i*(W-2*P)/(vals.length-1),mx===mn?H/2:H-P-(v-mn)/rg*(H-2*P)];});
  var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var area=line+' L'+pts[pts.length-1][0].toFixed(1)+' '+H+' L'+pts[0][0].toFixed(1)+' '+H+' Z';
  var e=pts[pts.length-1];
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+area+'" fill="var(--accent-soft)" stroke="none"/><path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/></svg>';
}

/* ---------- label scanning: text to values (Romanian and English labels, OCR noise tolerated) ---------- */
function stripDia(s){try{return s.normalize('NFD').replace(/[̀-ͯ]/g,'');}catch(e){return s;}}
function cleanLine(raw){
  var s=stripDia(String(raw)).toLowerCase().replace(/\|/g,' ');
  s=s.replace(/\d[o]|[o]\d/g,function(m){return m.replace('o','0');});
  s=s.replace(/\d[li]|[li]\d/g,function(m){return m.replace(/[li]/,'1');});
  s=s.replace(/(\d[.,])[lio]/g,function(m,p){return p+(m.slice(-1)==='o'?'0':'1');});
  s=s.replace(/(\d)\s*[.,]\s*(\d)/g,'$1.$2');
  s=s.replace(/(\d)\s*(µg|μg|ug|mcg|pg|yg)(?![a-z])/g,'$1 ug');
  s=s.replace(/(\d)\s*q(?![a-z])/g,'$1 g');
  s=s.replace(/(\d)\s*%\s*ca[l1i]/g,'$1 kcal').replace(/(\d{3})\s*c?ca[l1i]?(?![a-z])/g,'$1 kcal').replace(/k[ce]a[l1i]/g,'kcal').replace(/(\d)\s*k[ce]a?l?(?![a-z])/g,'$1 kcal').replace(/\bk\s?j\b/g,'kj').replace(/(\d)\s*k[3\]l1i]\b/g,'$1 kj');

  return s;

/* A gram value with no unit usually means OCR read the "g" as a "9" glued to the number (12,5 g becomes 12,59) */
function ungluedGrams(tok){
  if(tok.unit||tok.raw.length<2||!/9$/.test(tok.raw))return tok.val;
  var alt=tok.raw.slice(0,-1).replace(/\.$/,'');
  return alt?parseFloat(alt):tok.val;
}
var TOK_RE=/(^|[^a-z0-9.])<?\s*(\d+(?:\.\d+)?)\s*(kcal|kj|mg|ug|ml|g|%)?(?![0-9])(?![a-z]{3})/g;

    var val=parseFloat(raw),dec=raw.indexOf('.')>-1,orig=raw;
    if(!dec&&/^0\d+$/.test(raw)){raw='0.'+raw.slice(1);val=parseFloat(raw);dec=true;}
    if(val===100&&(unit==='g'||unit==='ml'))return;
    out.push({raw:raw,orig:orig,val:val,unit:unit,dec:dec,idx:idx,lead:lead||''});
  }
  while((m=TOK_RE.exec(seg))){
    push(m[2],m[3]||'',m.index+m[1].length);
    if(m.index===TOK_RE.lastIndex)TOK_RE.lastIndex++;
  }
  TOK_GLUED_RE.lastIndex=0;
  while((m=TOK_GLUED_RE.exec(seg))){
    var idx=m.index+1;
    if(!out.some(function(t){return t.idx===idx;}))push(m[1]||m[3],m[2]||m[4],idx,seg.charAt(m.index));
    if(m.index===TOK_GLUED_RE.lastIndex)TOK_GLUED_RE.lastIndex++;

function thousands(tok,big){

/* Plausible readings of a gram value, most likely first. The small print loses commas and glues the "g" on as a "9",

  if(tok.unit==='mg')return [r3(tok.val/1000)];
  if(tok.unit==='ug')return [r3(tok.val/1e6)];

  var raw=tok.raw,list=[],decs=raw.indexOf('.')>-1?raw.split('.')[1].length:0,ends9=/9$/.test(raw)&&!tok.unit&&raw.length>1;

  if(decs>=2){add(unglued);add(tok.val);}
  else if(decs===1){add(tok.val);add(unglued);}
  else if(tok.val>=100){add(unglued);add(unglued!=null?unglued/10:null);add(tok.val/10);add(tok.val/100);}
  else if(raw.length===2&&ends9){add(tok.val);add(unglued);add(tok.val/10);}
  else{add(tok.val);add(unglued);add(tok.val/10);}

function loadScript(urls){

    if(b.getAttribute('data-tab')===UI.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
}
function noticesHtml(globalOnly){
  var h='';
  if(UI.updateReady)h+='<div class="notice"><p class="hint">A new version of the app is ready.</p><div class="row"><button class="btn small" data-act="reload">Reload now</button></div></div>';
  if(S.storeState==='memory')h+='<div class="notice"><p class="hint">This browser is not letting the app save, so entries disappear when you close it. Open the app from your home screen or a normal (not private) browser tab.</p></div>';
  if(globalOnly)return h;
  if(UI.tab==='train'&&!isStandalone()&&!UI.installDismissed)h+='<div class="notice">'+installHtml()+'<div class="row"><button class="btn ghost small" data-act="install-dismiss">Not now</button></div></div>';
  if(UI.tab==='train'&&S.storeState==='ok'&&hasUserData()){
    var lb=S.meta&&S.meta.lastBackup,n=lb?daysSince(lb):null;
    if(!lb||n>=14)h+='<div class="notice"><p class="hint">'+(lb?'Last backup was '+n+' days ago.':'No backup yet.')+' Your log lives only on this phone, so save a copy now and then.</p><div class="row"><button class="btn small" data-act="export">Save backup</button></div></div>';
  }
  return h;
}
function welcomeHtml(){
  return '<section class="card welcome"><div class="eyebrow">Welcome</div><h2>Your log lives on this phone</h2>'+
    '<p>Load the backup file from Claude to bring in your weekly plan, your records and the example ingredients. Or start empty and build your plan yourself.</p>'+
    '<div class="row"><button class="btn primary" data-act="import">Load backup file</button><button class="btn ghost" data-act="start-empty">Start empty</button></div></section>'+
    (isStandalone()?'':'<section class="card"><h3>Install</h3>'+installHtml()+'</section>');
}
function importConfirmHtml(){
  var p=UI.importPending,when=p.exportedAt&&isFinite(Date.parse(p.exportedAt))?', saved '+fmtDate(new Date(p.exportedAt)):'';
  return '<section class="card"><h3>Load this backup?</h3><p class="hint">'+(isEmpty()?'It has ':'It replaces everything on this phone with ')+esc(countsText(p.docs))+esc(when)+'.</p>'+
    '<div class="row"><button class="btn primary" data-act="import-yes">Load backup</button><button class="btn ghost" data-act="import-no">Cancel</button></div></section>';
}
function render(){
  pendingRender=false;
  renderTop();renderTabs();
  var h;
  if(S.storeState==='loading')h=loadingHtml('log');
  else if(UI.importPending)h=importConfirmHtml();
  else if(isEmpty()&&UI.tab!=='settings')h=noticesHtml(true)+welcomeHtml();
  else{
    h=noticesHtml();
    if(UI.tab==='train')h+=renderTrain();else if(UI.tab==='prs')h+=renderPRs();else if(UI.tab==='settings')h+=renderSettings();else h+=renderFood();
  }
  $app.innerHTML='<div class="wrap stack">'+h+'</div>';
}

/* ---------- Settings view ---------- */
function renderSettings(){
  var lb=S.meta&&S.meta.lastBackup,c=countsText(allDocs())||'Nothing saved yet';
  var h='<section class="card"><h3>Backup</h3><p class="hint">Your log is stored only on this phone. Save a backup every week or two and keep it somewhere safe, such as Files, iCloud Drive or Google Drive. A backup also moves your log to a new phone.</p>';
  h+='<div class="kv"><span>Last backup</span><b>'+(lb?esc(fmtDate(new Date(lb))+', '+agoText(lb)):'Never')+'</b></div>';
  h+='<div class="kv"><span>On this phone</span><b>'+esc(c)+'</b></div>';
  h+='<div class="row"><button class="btn primary" data-act="export">Save backup</button><button class="btn" data-act="import">Load backup</button></div><p class="hint">Loading a backup replaces what is on this phone.</p></section>';
  h+='<section class="card"><h3>Install</h3>'+installHtml()+'</section>';
  h+='<section class="card"><h3>Label scanning</h3><p class="hint">The first scan downloads the text reader with its Romanian and English language files (c.20 MB) and needs an internet connection. After that, scanning works offline. The photo never leaves your phone. The reader straightens the photo, finds the column of values and reads it on its own, with a small digit recogniser trained for food labels built into the app, so a tight crop around the table still gives the best result. A photo taken sideways can be turned with Rotate in the crop view. Version numbers run 1.2.y, where y counts the scanner iterations since it first appeared in 1.2.</p></section>';
  h+='<section class="card"><h3>Storage</h3><p class="hint">'+(S.storeState==='memory'?'Saving is not available in this browser.':(S.persisted?'Protected: the browser will not clear your log to free up space.':'The browser may clear site data if your phone runs very low on space, so keep a recent backup.'))+'</p></section>';
  h+='<p class="hint center">Casian Fitness Log, version '+APP_VERSION+'</p>';
  return h;
}

/* ---------- Train view ---------- */
function renderTrain(){
  if(!ready('plan','settings'))return loadingHtml('training plan');
  var vMon=viewMonday(),tY=todayY(),h='<div class="days" id="days">';
  DAYS.forEach(function(k,i){
    var d=addDays(vMon,i),y=ymd(d),sel=k===UI.selDay,rest=!dayItems(k).length;
    h+='<button class="day'+(sel?' sel':'')+(y===tY?' today':'')+(rest?' rest':'')+'" data-act="day" data-day="'+k+'" aria-pressed="'+sel+'" aria-label="'+DAY_LONG[k]+' '+fmtDM(d)+(rest?', rest day':'')+'"><span class="d-name">'+DAY_SHORT[k]+'</span><span class="d-num">'+d.getDate()+'</span></button>';
  });
  h+='</div>';
  h+=UI.editDay?renderDayEdit():renderDay();
  h+=renderBlock();
  return h;
}
function tagsHtml(ex){return (ex.main?' <span class="tag">Main</span>':'')+(ex.role==='warmup'?' <span class="tag soft">Warm-up</span>':'');}
function exRow(ex,letter){
  var meta=exMeta(ex);
  return '<div class="ex" data-row="'+esc(ex.id)+'">'+(letter?'<span class="ab" aria-label="Move '+letter+'">'+letter+'</span>':'')+
    '<div class="ex-body"><div class="ex-head"><div class="ex-name">'+esc(ex.name||'Untitled exercise')+tagsHtml(ex)+'</div>'+(meta?'<div class="ex-meta">'+esc(meta)+'</div>':'')+'</div>'+
    (ex.note?'<div class="ex-note">'+esc(ex.note)+'</div>':'')+'</div></div>';
}
function longRunHtml(ex,d){
  var sc=longRunSchedule(d);
  if(UI.lrForm)return lrFormHtml();
  if(!sc)return '<div class="lr"><div class="ex-name">'+esc(ex.name)+'</div><p class="hint">Tell the app your last long run and it works out every week from there: a new distance on easy weeks, 60/30/10 on repeat weeks.</p><div class="row"><button class="btn primary small" data-act="lr-open">Set last long run</button></div></div>';
  var easy=sc.kind==='easy',km=sc.km;
  var h='<div class="lr"><div class="ex-name">'+esc(ex.name)+'</div>';
  h+='<div class="lr-top"><span class="lr-km">'+fmtKm(km)+'</span><span class="lr-unit">km</span><span class="lr-kind'+(easy?' easy':'')+'">'+(easy?'Easy':'60/30/10')+'</span></div>';
  if(easy){
    h+='<div class="lr-why">New distance this week, so keep it fully easy: conversational the whole way, heart rate c.140 or below, drink every 15 to 20 min.</div>';
    if(sc.prevKm>0)h+='<div class="ex-note">Fallback: if your legs are heavy or sleep was short, repeat '+fmtKm(sc.prevKm)+' km easy instead. Adding distance can wait a week.</div>';
  }else{
    var e=r1(km*0.6),s=r1(km*0.9),last=r1(km-s);
    h+='<div class="lr-why">Repeat distance this week, so add intensity. Judge effort by breathing, not the watch.</div>';
    h+='<div class="lr-splits"><div class="lr-split"><b>to '+fmtKm(e)+' km</b><span>Easy, conversational</span></div><div class="lr-split"><b>to '+fmtKm(s)+' km</b><span>Steady, short sentences</span></div><div class="lr-split"><b>last '+fmtKm(last)+' km</b><span>Comfortably hard</span></div></div>';
    h+='<div class="ex-note">Drink every 15 to 20 min. Next week goes back to easy with the distance one step up.</div>';
  }
  h+='<div class="lr-foot"><span>Based on your '+fmtKm(sc.lr.km)+' km '+(sc.lr.kind==='easy'?'easy':'60/30/10')+' on '+fmtDate(sc.anchor)+'</span><button class="btn ghost small" data-act="lr-open">Adjust</button></div></div>';
  return h;
}

function renderDay(){
  var d=selDate(),y=ymd(d),k=UI.selDay,dp=dayPlan(k),items=dayItems(k);
  if(!S.plan)return '<div class="card"><div class="empty"><strong>No plan yet</strong>Add the exercises for each day and they show up here.</div><div class="row"><button class="btn primary" data-act="edit-day">Add exercises</button></div></div>';
  var label=[(dp&&dp.title)||(!items.length?'Rest day':''),fmtDate(d)].filter(Boolean).join(', ');
  var h='<div class="dayhead"><div class="min0"><h2>'+DAY_LONG[k]+'</h2><div class="sub">'+esc(label)+'</div></div><button class="btn ghost small" data-act="edit-day">Edit day</button></div>';
  if(dp&&dp.note)h+='<p class="daynote">'+esc(dp.note)+'</p>';
  if(!items.length)return h+'<div class="card"><div class="empty"><strong>Rest day</strong>Nothing planned. Recovery is part of the program.</div></div>';
  var blocks=[],i;
  for(i=0;i<items.length;i++){
    var ex=items[i];
    if(ex.role==='longrun'){blocks.push({kind:'longrun',ex:ex});continue;}
    if(ex.pairNext&&items[i+1]&&items[i+1].role!=='longrun'){blocks.push({kind:'pair',a:ex,b:items[i+1]});i++;}
    else blocks.push({kind:'single',ex:ex});
  }
  var hasPair=blocks.some(function(b){return b.kind==='pair';});
  h+='<div class="sheet">'+blocks.map(function(b){
    if(b.kind==='pair')return '<div class="pair"><div class="pair-head">Pair: alternate sets</div>'+exRow(b.a,'A')+exRow(b.b,'B')+'</div>';
    if(b.kind==='longrun')return longRunHtml(b.ex,d);
    return exRow(b.ex);
  }).join('')+'</div>';
  if(hasPair&&S.plan.restNote)h+='<p class="restnote">'+esc(S.plan.restNote)+'</p>';
  return h;
}

/* ---------- Records view ---------- */
function renderPRs(){
  if(!ready('prs'))return loadingHtml('records');
  var list=Object.keys(S.prs).map(function(id){return [id,S.prs[id]];}).sort(function(a,b){
    var oa=a[1].order==null?1e15:a[1].order,ob=b[1].order==null?1e15:b[1].order;
    return (oa-ob)||String(a[1].name).localeCompare(String(b[1].name));
  });
  var h='';
  if(!list.length)h+='<div class="card"><div class="empty"><strong>No records yet</strong>Add an exercise or run you want to track, then log each test.</div></div>';
  else h+='<div class="legend">Gold dot: a new best at the time</div>';
  list.forEach(function(p){h+=prCard(p[0],p[1]);});
  h+=UI.newPr?newPrForm():'<div class="row"><button class="btn" data-act="pr-new">Add a record</button></div>';
  return h;
}
function prCard(id,pr){
  var hist=pr.history||[],b=prBest(pr),unit=pr.type==='secs'?'s':(pr.type==='run'?'km':'reps'),bestHtml;
  if(!b)bestHtml='<p class="hint">No result yet. Log your first test.</p>';
  else{
    var bv=prVal(pr,b),prev=hist.map(function(x){return prVal(pr,x);}).filter(function(v){return v<bv;}),pv=prev.length?Math.max.apply(null,prev):null;
    var show=pr.type==='run'?fmtKm:function(v){return String(v);};
    bestHtml='<div class="pr-best"><span class="big">'+show(bv)+'</span><span class="unit">'+unit+'</span></div>';
    if(pr.type==='run'&&b.sec)bestHtml+='<div class="delta">'+fmtDur(b.sec)+', '+paceStr(b.km,b.sec)+'</div>';
    if(pv!=null)bestHtml+='<div class="delta"><b>+'+show(Math.round((bv-pv)*100)/100)+'</b> over the previous best of '+show(pv)+'</div>';
  }
  var runMax=-Infinity,marks=hist.map(function(x){var v=prVal(pr,x),isPr=v>runMax;if(isPr)runMax=v;return isPr;});
  var rowsAll=hist.map(function(x,i){return {x:x,isPr:marks[i]};}).reverse();
  var showAll=!!UI.prAll[id],rows=showAll?rowsAll:rowsAll.slice(0,5);
  var rowsHtml=rows.map(function(r){
    return '<li><span class="h-when">'+esc(whenLabel(r.x))+'</span><span class="h-val'+(r.isPr?' is-pr':'')+'">'+(pr.type==='run'?fmtKm(r.x.km)+' km':esc(r.x.value))+'</span><span class="h-note">'+esc(noteFor(pr,r.x))+'</span></li>';
  }).join('');
  var more=rowsAll.length>5?'<button class="link" data-act="pr-all" data-id="'+esc(id)+'">'+(showAll?'Show fewer':'Show all '+rowsAll.length)+'</button>':'';
  var foot;
  if(UI.prForm&&UI.prForm.id===id)foot=prLogForm(pr);
  else if(UI.prDel===id)foot='<div class="confirm"><span>Delete '+esc(pr.name)+' and its history?</span><div class="row"><button class="btn danger" data-act="pr-del-yes" data-id="'+esc(id)+'">Delete</button><button class="btn ghost" data-act="pr-del-no">Cancel</button></div></div>';
  else foot='<div class="row between"><button class="btn primary small" data-act="pr-log" data-id="'+esc(id)+'">Log result</button><button class="btn ghost danger small" data-act="pr-del" data-id="'+esc(id)+'">Delete</button></div>';
  return '<section class="card">'+
    '<div class="pr-top"><div class="min0"><div class="pr-name">'+esc(pr.name)+'</div>'+(pr.test?'<div class="pr-test">'+esc(pr.test)+'</div>':'')+'</div>'+spark(hist.map(function(x){return prVal(pr,x);}))+'</div>'+
    '<div>'+bestHtml+'</div>'+
    (rowsHtml?'<ul class="hist">'+rowsHtml+'</ul>':'')+more+foot+'</section>';
}
function pfld(label,id,f,value,mode){
  return '<label class="fld" for="'+id+'"><span>'+label+'</span><input class="num" id="'+id+'" type="text" inputmode="'+mode+'" autocomplete="off" data-k="prf" data-f="'+f+'" value="'+esc(value)+'" placeholder=" "></label>';
}
function prLogForm(pr){
  var f=UI.prForm,vals;
  if(pr.type==='run')vals='<div class="run-grid">'+pfld('km','prf-km','km',f.km,'decimal')+pfld('min','prf-min','min',f.min,'numeric')+pfld('sec','prf-s','s',f.s,'numeric')+'</div>';
  else vals='<div class="grams-row">'+pfld(pr.type==='secs'?'Seconds':'Reps','prf-value','value',f.value,'numeric')+'<div></div></div>';
  return '<div class="form-block">'+vals+
    '<div class="grid2"><label class="fld" for="prf-date"><span>Date</span><input class="txt" type="date" id="prf-date" data-k="prf" data-f="date" value="'+esc(f.date)+'"></label>'+
    '<label class="fld" for="prf-note"><span>Note</span><input class="txt" id="prf-note" data-k="prf" data-f="note" value="'+esc(f.note)+'" placeholder="Optional"></label></div>'+
    (f.err?'<p class="err">'+esc(f.err)+'</p>':'')+
    '<div class="row"><button class="btn primary" data-act="pr-log-save">Save result</button><button class="btn ghost" data-act="pr-log-cancel">Cancel</button></div></div>';
}
function newPrForm(){
  var f=UI.newPr;
  var types=[['reps','Reps'],['secs','Seconds (holds)'],['run','Run distance and time']].map(function(t){return '<option value="'+t[0]+'"'+(f.type===t[0]?' selected':'')+'>'+t[1]+'</option>';}).join('');

    '<label class="fld" for="prn-type"><span>Measured in</span><select class="txt" id="prn-type" data-k="prn" data-f="type">'+types+'</select></label>'+
    (f.err?'<p class="err">'+esc(f.err)+'</p>':'')+
    '<div class="row"><button class="btn primary" data-act="pr-new-save">Add record</button><button class="btn ghost" data-act="pr-new-cancel">Cancel</button></div></section>';
}

function macroHtml(name,v,t,color){
  return '<div class="min0"><div class="m-name">'+name+'</div><div class="m-val">'+fmtInt(v)+'<small> '+(t?'/ '+fmtInt(t)+' g':'g')+'</small></div>'+(t?barHtml(v,t,color):'')+'</div>';

function barHtml(v,t,color){
  var p=Math.max(0,Math.min(100,v/t*100));
  return '<div class="bar" role="img" aria-label="'+Math.round(v/t*100)+'% of target"><span style="width:'+p.toFixed(1)+'%;background:var('+color+')"></span></div>';
}
function pct(v,ref){return ref?Math.round(v/ref*100)+'%':'';}
function detailsHtml(tot){

ACT['targets-cancel']=function(){UI.targetsForm=null;render();};
ACT['targets-save']=function(){
  var f=UI.targetsForm;S.settings=S.settings||{blockStart:null};
  S.settings.targets={kcal:num(f.kcal),protein:num(f.protein),carbs:num(f.carbs),fat:num(f.fat)};
  save('app/settings',S.settings,0);UI.targetsForm=null;toast('Targets saved');render();
};
ACT['meal-new']=function(){UI.newMeal=true;UI.addTo=null;render();};
ACT['meal-new-cancel']=function(){UI.newMeal=false;UI.mealName='';render();};
function addMeal(name){
  name=(name||'').trim();if(!name){toast('Give the meal a name');return;}
  var md=mealsDoc(UI.foodDate,true),id='m-'+uid();md.meals.push({id:id,name:name,items:[]});
  save('meals/'+UI.foodDate,md,0);UI.newMeal=false;UI.mealName='';UI.addTo=id;UI.pick=null;UI.ingSearch='';render();focusLater('ingsearch');
}
ACT['meal-add']=function(b){addMeal(b.getAttribute('data-name'));};
ACT['meal-add-custom']=function(){addMeal(UI.mealName);};
ACT['pick-open']=function(b){UI.addTo=b.getAttribute('data-meal');UI.pick=null;UI.grams='';UI.ingSearch='';UI.delMeal=null;render();focusLater('ingsearch');};
ACT['pick-close']=function(){UI.addTo=null;UI.pick=null;UI.grams='';render();};
ACT['pick-ing']=function(b){UI.pick=b.getAttribute('data-id');UI.grams='';render();focusLater('grams');};
ACT['pick-back']=function(){UI.pick=null;UI.grams='';render();focusLater('ingsearch');};
ACT['pick-add']=function(){
  var ing=S.ingredients[UI.pick],g=num(UI.grams);if(!ing)return;
  if(!(g>0)){toast('Enter the amount in grams');focusLater('grams');return;}
  var md=mealsDoc(UI.foodDate,true),m=md.meals.filter(function(x){return x.id===UI.addTo;})[0];if(!m)return;
  var v=scale(ing,g);m.items=m.items||[];
  var it={ing:UI.pick,name:ing.name,g:r1(g)};LABEL.forEach(function(l){it[l.k]=v[l.k];});if(Object.keys(v.micros).length)it.micros=v.micros;
  m.items.push(it);
  save('meals/'+UI.foodDate,md,0);toast('Added '+fmtG(g)+' '+(ing.basis==='ml'?'ml':'g')+' '+ing.name);UI.pick=null;UI.grams='';UI.ingSearch='';render();
};
ACT['rm-item']=function(b){
  var md=mealsDoc(UI.foodDate,false);if(!md)return;
  var m=md.meals.filter(function(x){return x.id===b.getAttribute('data-meal');})[0];if(!m)return;
  m.items.splice(+b.getAttribute('data-i'),1);save('meals/'+UI.foodDate,md,0);render();
};
ACT['meal-del']=function(b){UI.delMeal=b.getAttribute('data-meal');render();};
ACT['meal-del-no']=function(){UI.delMeal=null;render();};
ACT['meal-del-yes']=function(b){
  var md=mealsDoc(UI.foodDate,false),id=b.getAttribute('data-meal');if(!md)return;
  md.meals=md.meals.filter(function(x){return x.id!==id;});save('meals/'+UI.foodDate,md,0);
  UI.delMeal=null;if(UI.addTo===id)UI.addTo=null;render();
};
ACT['ing-new']=function(){UI.ingForm=blankIngForm();render();window.scrollTo(0,0);focusLater('if-name');};
ACT['ing-new-from-pick']=function(){var f=blankIngForm();f.name=UI.ingSearch||'';f.returnTo={meal:UI.addTo,date:UI.foodDate};UI.ingForm=f;UI.foodView='ingredients';render();window.scrollTo(0,0);focusLater(UI.ingSearch?'if-kcal':'if-name');};
ACT['ing-edit']=function(b){var id=b.getAttribute('data-id');if(!S.ingredients[id])return;UI.ingForm=ingFormFrom(id);render();window.scrollTo(0,0);};
ACT['ing-cancel']=function(){
  if(UI.ingForm&&UI.ingForm.crop)URL.revokeObjectURL(UI.ingForm.crop.url);
  var r=UI.ingForm&&UI.ingForm.returnTo;UI.ingForm=null;
  if(r){UI.foodView='log';UI.foodDate=r.date;UI.addTo=r.meal;UI.pick=null;}
  render();
};
ACT['ing-save']=function(){
  var f=UI.ingForm,name=(f.name||'').trim(),kcal=num(f.kcal);
  if(!name){f.err='Give the ingredient a name.';render();return;}
  if(kcal==null){f.err='Enter the calories per 100 g.';render();return;}
  var id=f.id||('ing-'+uid()),old=S.ingredients[f.id]||{};
  var x={name:name,basis:f.basis==='ml'?'ml':'g',example:false,updated:Date.now(),source:(f.scan&&f.scan.done)?'scan':(old.source==='scan'?'scan':'label'),micros:{}};
  LABEL.forEach(function(l){var v=num(f[l.k]);x[l.k]=l.k==='kcal'?kcal:(['p','c','f'].indexOf(l.k)>-1?(v==null?0:v):v);});
  Object.keys(f.micros||{}).forEach(function(m){var v=num(f.micros[m]);if(MICRO_BY[m]&&v!=null)x.micros[m]=v;});
  S.ingredients[id]=x;
  save('ingredients/'+id,x,0);toast('Ingredient saved');
  var r=f.returnTo;UI.ingForm=null;
  if(r){UI.foodView='log';UI.foodDate=r.date;UI.addTo=r.meal;UI.pick=id;UI.grams='';render();focusLater('grams');return;}
  render();
};
ACT['ing-del']=function(){UI.ingForm.confirmDel=true;render();};
ACT['ing-del-no']=function(){UI.ingForm.confirmDel=false;render();};
ACT['ing-del-yes']=function(){var id=UI.ingForm.id;delete S.ingredients[id];removeDoc('ingredients/'+id);UI.ingForm=null;toast('Ingredient deleted');render();};
ACT['micros-toggle']=function(){if(UI.ingForm){UI.ingForm.showMicros=!UI.ingForm.showMicros;render();}};
ACT.scan=function(){if(!UI.ingForm||UI.ingForm.crop||(UI.ingForm.scan&&UI.ingForm.scan.busy))return;$scan.click();};
ACT['crop-read']=function(){finishCrop(false);};
ACT['crop-all']=function(){finishCrop(true);};
ACT['crop-rotate']=function(){rotateCrop();};
ACT['crop-cancel']=function(){var f=UI.ingForm;if(f&&f.crop){URL.revokeObjectURL(f.crop.url);f.crop=null;render();}};
ACT['scan-text']=function(){if(UI.ingForm&&UI.ingForm.scan){UI.ingForm.scan.showText=!UI.ingForm.scan.showText;render();}};
ACT['scan-copy']=function(){
  var s=UI.ingForm&&UI.ingForm.scan;if(!s)return;
  var text='Scanned label text (Casian Fitness Log '+APP_VERSION+')\n'+(s.text||'');
  function fallback(){
    s.showText=true;render();
    var el=document.getElementById('scan-text');if(!el)return;
    var r=document.createRange();r.selectNodeContents(el);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
    toast('Text selected. Long-press it to copy.',3500);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){toast('Scanned text copied. Paste it into the chat.',3000);},fallback);
  else fallback();
};

/* ---------- inputs ---------- */
var INPUT={};
INPUT['pe-title']=function(t){ensurePlan();S.plan.days[UI.selDay].title=t.value;savePlan();};
INPUT['pe-note']=function(t){ensurePlan();S.plan.days[UI.selDay].note=t.value;savePlan();};
INPUT.pe=function(t){
  ensurePlan();var it=S.plan.days[UI.selDay].items[+t.getAttribute('data-i')];if(!it)return;
  var f=t.getAttribute('data-f');
  if(f==='main')it.main=t.checked;
  else if(f==='pairNext')it.pairNext=t.checked;
  else if(f==='warmup')it.role=t.checked?'warmup':undefined;
  else if(f==='sets')it.sets=Math.max(1,Math.min(10,parseInt(t.value,10)||1));
  else it[f]=t.value;
  savePlan();
};
INPUT.lr=function(t){if(UI.lrForm)UI.lrForm[t.getAttribute('data-f')]=t.value;};
INPUT.prf=function(t){if(UI.prForm)UI.prForm[t.getAttribute('data-f')]=t.value;};
INPUT.prn=function(t){if(UI.newPr)UI.newPr[t.getAttribute('data-f')]=t.value;};
INPUT.tg=function(t){if(UI.targetsForm)UI.targetsForm[t.getAttribute('data-f')]=t.value;};
INPUT['if']=function(t){if(UI.ingForm)UI.ingForm[t.getAttribute('data-f')]=t.value;};
INPUT.im=function(t){if(UI.ingForm){UI.ingForm.micros=UI.ingForm.micros||{};UI.ingForm.micros[t.getAttribute('data-f')]=t.value;}};
INPUT.mealname=function(t){UI.mealName=t.value;};
INPUT.blockdate=function(t){if(UI.blockForm)UI.blockForm.date=t.value;};
INPUT.ingsearch=function(t){UI.ingSearch=t.value;var el=document.getElementById('inglist');if(el)el.innerHTML=ingOptions();};
INPUT.ingfilter=function(t){UI.ingFilter=t.value;var el=document.getElementById('ingrows');if(el)el.innerHTML=ingRows();};
INPUT.grams=function(t){UI.grams=t.value;var el=document.getElementById('preview');if(el)el.innerHTML=previewHtml(S.ingredients[UI.pick]);};

function handleInput(t){var k=t.getAttribute&&t.getAttribute('data-k');if(k&&INPUT[k])INPUT[k](t);}
document.addEventListener('input',function(e){var t=e.target;if(t.type==='checkbox'||t.tagName==='SELECT'||t.type==='file')return;handleInput(t);});
document.addEventListener('change',function(e){var t=e.target;if(t.type==='checkbox'||t.tagName==='SELECT')handleInput(t);});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act');if(ACT[a]){e.preventDefault();ACT[a](b,e);}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var id=e.target&&e.target.id;
  if(id==='grams'){e.preventDefault();ACT['pick-add']();}
  else if(id==='meal-name'){e.preventDefault();ACT['meal-add-custom']();}
  else if(id==='ingsearch'){e.preventDefault();var l=ingSorted(UI.ingSearch,false);if(l.length===1){UI.pick=l[0][0];UI.grams='';render();focusLater('grams');}}
});
/* Re-check the date when the app comes back to the front, so "today" stays right overnight. */
var lastDay=todayY();
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  var t=todayY();if(t!==lastDay){lastDay=t;UI.weekOffset=0;UI.selDay=dayKeyOf(new Date());UI.foodDate=t;requestRender();}
});

/* ---------- start ---------- */
window.CFL={parseLabel:parseLabel,PLAN_V2:PLAN_V2,version:APP_VERSION};
render();
openIdb().then(function(h){
  KV=h?idbKV(h):(lsWorks()?lsKV():memKV());
  return KV.all();
}).then(function(all){
  S.storeState=KV.kind==='mem'?'memory':'ok';loadDocs(all);migrate();render();requestPersist();
}).catch(function(){
  KV=memKV();S.storeState='memory';loadDocs({});render();
});
})();
</script>
</body>
</html>

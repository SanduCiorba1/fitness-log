<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casian Fitness Log</title>
<meta name="description" content="Training plan, rep logging, personal records and meal tracking, stored on your phone.">
<meta name="theme-color" content="#EDF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1211" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column; sticky header carries the week or day; fixed bottom tab bar; set inputs sit in a grid like a printed workout sheet */
:root{
  --bg:#EDF0EE;
  --surface:#FFFFFF;
  --sunk:#E3E8E5;
  --ink:#141D1A;
  --muted:#58655F;
  --line:#D1D9D5;
  --accent:#2446C4;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCE3FA;
  --gold:#946800;
  --gold-soft:#F5E8C2;
  --danger:#B3261E;
  --c-p:#2446C4;
  --c-c:#2C8770;
  --c-f:#B3741A;
  --shadow:rgba(10,20,16,.08);
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1211; --surface:#161D1B; --sunk:#0A0E0D; --ink:#E4EBE8; --muted:#97A39E; --line:#2A3431;
    --accent:#8DA4FF; --accent-ink:#0A1233; --accent-soft:#1D2950; --gold:#E6B84C; --gold-soft:#3A3017;
    --danger:#F2877F; --c-p:#8DA4FF; --c-c:#5BC4A6; --c-f:#E3A955; --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:620px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.row.nowrap .txt{flex:1}
.row.tight{gap:2px}
.min0{min-width:0}
.hint{margin:0;font-size:14px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.center{text-align:center}
.err{margin:0;color:var(--danger);font-size:14px;font-weight:500}
.dim{color:var(--muted)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 12px;border-bottom:1px solid var(--line)}
.top-grid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top-right{display:flex;align-items:center;gap:2px;padding-bottom:2px;margin-right:-8px}
.eyebrow{font:600 12px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.title-row{display:flex;align-items:center;gap:0;margin:2px 0 0 -8px}
.title-row.nonav{margin-left:0}
.h-title{margin:0;font:700 34px/1 var(--font-display);letter-spacing:.005em;text-wrap:balance;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px;margin-top:2px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.link{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:600 14px var(--font-body)}
.status{font:600 11.5px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;padding-right:2px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-c)}
.status[data-state="busy"]::before{background:var(--muted)}
.status[data-state="err"]{color:var(--danger)}
.status[data-state="err"]::before{background:var(--danger)}
.icon-btn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}

/* Main + tab bar */
main{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px var(--font-body);letter-spacing:.07em;text-transform:uppercase}
.tab[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:600 14px var(--font-body);max-width:calc(100% - 32px);width:max-content;text-align:center;box-shadow:0 6px 20px var(--shadow)}

/* Buttons and fields */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:600 15px/1.2 var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 10px;font-size:14px}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--ink);width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;flex:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn.sm{width:34px;height:34px;color:var(--muted)}
.icon-btn[disabled]{opacity:.3;cursor:default}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font:600 11px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.txt{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font:500 16px var(--font-body);color:var(--ink)}
textarea.txt{min-height:76px;resize:vertical;line-height:1.4}
.num{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 4px;text-align:center;font:700 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.num::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.num:not(:placeholder-shown){background:var(--accent-soft);border-color:transparent}
.check{display:flex;align-items:center;gap:8px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3,.block h3{margin:0;font:700 21px/1.1 var(--font-display);letter-spacing:.01em}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.notice{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.notice .hint{color:var(--ink)}
.empty{padding:20px 16px;color:var(--muted);font-size:15px}
.empty strong{display:block;color:var(--ink);font:700 21px/1.15 var(--font-display);margin-bottom:4px}
.card .empty{padding:0}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--sunk);font-size:15px}
.form-block{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.tag{font:700 10.5px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--ink);color:var(--bg);flex:none}
.chip{font:700 10.5px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);vertical-align:2px}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.welcome h2{margin:0;font:700 30px/1.05 var(--font-display);text-wrap:balance}
.welcome p{margin:0;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-top:1px solid var(--line);padding-top:10px}
.kv span{color:var(--muted);flex:none}
.kv b{text-align:right;font-weight:600;min-width:0}

/* Train */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);min-width:0}
.d-name{font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.d-num{font:700 21px/1 var(--font-display);font-variant-numeric:tabular-nums}
.day.rest .d-num{color:var(--muted)}
.d-dot{width:6px;height:6px;border-radius:50%;background:transparent}
.d-dot.on{background:var(--accent)}
.day.today{border-color:var(--ink);border-width:2px;padding:7px 0 6px}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel .d-name,.day.sel .d-num{color:inherit}
.day.sel .d-name{opacity:.75}
.day.sel .d-dot.on{background:var(--bg)}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dayhead h2{margin:0;font:700 27px/1.05 var(--font-display)}
.restnote{margin:-6px 0 0;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ex{padding:14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.ex-name{font:600 17px/1.25 var(--font-body);display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.ex-meta{font-size:13.5px;color:var(--muted)}
.ex-note{font-size:13.5px;color:var(--muted);margin-top:-6px}
.sets{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.run-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.run-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pace{min-height:46px;display:flex;align-items:center;justify-content:center;gap:3px;font:600 14px var(--font-body);color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
.pace b{font:700 21px var(--font-display);color:var(--ink)}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.block{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.pe{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pe:first-child{border-top:0}
.pe-grid{display:grid;grid-template-columns:minmax(0,1fr) 4.5rem;gap:8px}

/* Records */
.pr-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pr-name{font:700 23px/1.05 var(--font-display)}
.pr-test{font-size:13.5px;color:var(--muted);margin-top:3px}
.spark{flex:none;overflow:visible}
.pr-best{display:flex;align-items:baseline;gap:6px}
.big{font:700 54px/.95 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.unit{font:600 16px var(--font-display);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.delta{font-size:14px;color:var(--muted);margin-top:4px}
.delta b{color:var(--gold);font-weight:700}
.hist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.hist li{display:grid;grid-template-columns:6.2em 4.6em minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.h-when{color:var(--muted);font-variant-numeric:tabular-nums}
.h-val{font:700 18px var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.h-val.is-pr::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:2px}
.h-note{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.legend{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}

/* Food */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:9px;font:600 15px var(--font-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.kcal-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.of{color:var(--muted);font-size:15px}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.m-name{font:600 11px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.m-val{font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.m-val small{font:500 13px var(--font-body);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;border-radius:3px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.meal-tot{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.it-name{grid-column:1;grid-row:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.it-g{font-weight:500;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.it-mac{grid-column:1;grid-row:2;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.items .icon-btn{grid-column:2;grid-row:1 / span 2}
.picker{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.pick-sel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.pick-sel .it-mac{margin-top:2px}
.ing-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.ing-opt{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--ink)}
.ing-opt .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ing-opt .m{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.grams-row{display:grid;grid-template-columns:minmax(0,8rem) minmax(0,1fr);gap:12px;align-items:end}
.preview{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.preview b{font:700 22px var(--font-display);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ing-row{appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 14px;color:var(--ink)}
.ing-row:first-child{border-top:0}
.ing-row .n{font-weight:600;overflow-wrap:anywhere}
.ing-row .m{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ing-row.sel{background:var(--accent-soft)}

@media (max-width:370px){
  .h-title{font-size:30px}
  .run-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .run-grid .pace-fld{grid-column:1 / -1}
  .macros{gap:8px}
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
}
</style>
</head>
<body>
<header class="top gut" id="top"></header>
<main class="gut" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<nav class="tabbar gut" id="tabbar" aria-label="Sections">
  <div class="wrap">
    <button class="tab" data-act="tab" data-tab="train"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h20"/><rect x="5" y="7" width="3" height="10" rx="1"/><rect x="16" y="7" width="3" height="10" rx="1"/></svg>Train</button>
    <button class="tab" data-act="tab" data-tab="prs"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="15" r="5"/><path d="M8.5 3.5L12 10l3.5-6.5"/><path d="M12 13v4"/></svg>Records</button>
    <button class="tab" data-act="tab" data-tab="food"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M9 7.5c0-1.6 1.2-2 1.2-3.5M14 7.5c0-1.6 1.2-2 1.2-3.5"/></svg>Food</button>
  </div>
</nav>

<script>
(function(){
'use strict';
var APP_VERSION='1.0';
var APP_ID='casian-fitness-log';

/* ---------- helpers ---------- */
var DAYS=['mon','tue','wed','thu','fri','sat','sun'];
var DAY_LONG={mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};
var DAY_SHORT={mon:'Mon',tue:'Tue',wed:'Wed',thu:'Thu',fri:'Fri',sat:'Sat',sun:'Sun'};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MEAL_NAMES=['Breakfast','Lunch','Dinner','Snack'];
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function mondayOf(d){return addDays(d,-((d.getDay()+6)%7));}
function dayKeyOf(d){return DAYS[(d.getDay()+6)%7];}
function fmtDate(d){return d.getDate()+'-'+MON[d.getMonth()]+'-'+String(d.getFullYear()).slice(2);}
function fmtDM(d){return d.getDate()+' '+MON[d.getMonth()];}
function clone(o){return o==null?o:JSON.parse(JSON.stringify(o));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function num(v){if(v===''||v==null)return null;var n=Number(String(v).replace(',','.').trim());return isFinite(n)?n:null;}
function r1(n){return Math.round(n*10)/10;}
function fmtG(n){n=n||0;return n>=10?String(Math.round(n)):String(r1(n));}
function fmtInt(n){return Math.round(n||0).toLocaleString('en-US');}

/* ---------- storage on this phone (IndexedDB, with fallbacks) ---------- */
function openIdb(){
  return new Promise(function(res){
    if(!window.indexedDB)return res(null);
    var r;try{r=indexedDB.open(APP_ID,1);}catch(e){return res(null);}
    r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains('docs'))r.result.createObjectStore('docs');};
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){res(null);};
    r.onblocked=function(){res(null);};
  });
}
function idbKV(h){
  function tx(fn){return new Promise(function(res,rej){var t=h.transaction('docs','readwrite');fn(t.objectStore('docs'));t.oncomplete=function(){res();};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error||new Error('aborted'));};});}
  return {kind:'idb',
    all:function(){return new Promise(function(res,rej){var out={},t=h.transaction('docs','readonly'),req=t.objectStore('docs').openCursor();req.onsuccess=function(){var c=req.result;if(c){out[c.key]=c.value;c.continue();}};t.oncomplete=function(){res(out);};t.onerror=function(){rej(t.error);};});},
    put:function(k,v){return tx(function(st){st.put(v,k);});},
    del:function(k){return tx(function(st){st.delete(k);});},
    replaceAll:function(docs){return tx(function(st){st.clear();Object.keys(docs).forEach(function(k){st.put(docs[k],k);});});}
  };
}
function lsKV(){
  var P='cfl:';
  function keys(){var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(P)===0)ks.push(k);}return ks;}
  return {kind:'ls',
    all:function(){var out={};keys().forEach(function(k){try{out[k.slice(P.length)]=JSON.parse(localStorage.getItem(k));}catch(e){}});return Promise.resolve(out);},
    put:function(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));return Promise.resolve();}catch(e){return Promise.reject(e);}},
    del:function(k){try{localStorage.removeItem(P+k);}catch(e){}return Promise.resolve();},
    replaceAll:function(docs){try{keys().forEach(function(k){localStorage.removeItem(k);});Object.keys(docs).forEach(function(k){localStorage.setItem(P+k,JSON.stringify(docs[k]));});return Promise.resolve();}catch(e){return Promise.reject(e);}}
  };
}
function memKV(){
  var m={};
  return {kind:'mem',all:function(){return Promise.resolve(clone(m));},put:function(k,v){m[k]=clone(v);return Promise.resolve();},del:function(k){delete m[k];return Promise.resolve();},replaceAll:function(d){m=clone(d);return Promise.resolve();}};
}

var KV=null,writeErr=null,queue={},inflight={},timers={};
function save(path,data,delay){
  if(!KV)return;
  queue[path]={op:'set',data:clone(data)};updStatus();
  clearTimeout(timers[path]);timers[path]=setTimeout(function(){flush(path);},delay==null?300:delay);
}
function removeDoc(path){
  if(!KV)return;
  queue[path]={op:'del'};updStatus();clearTimeout(timers[path]);flush(path);
}
function flush(path){
  if(inflight[path])return;
  var job=queue[path];
  if(!job){updStatus();return;}
  delete queue[path];inflight[path]=true;updStatus();
  var p=job.op==='set'?KV.put(path,job.data):KV.del(path);
  p.then(function(){writeErr=null;},function(e){
    writeErr=e||'error';
    toast('Could not save on this phone. Storage may be full; save a backup and free up space.',5000);
  }).then(function(){
    inflight[path]=false;
    if(queue[path])flush(path);else updStatus();
  });
}
function flushAll(){Object.keys(queue).forEach(function(p){clearTimeout(timers[p]);flush(p);});}
document.addEventListener('visibilitychange',function(){if(document.hidden)flushAll();});
window.addEventListener('pagehide',flushAll);

function loadDocs(all){
  S.settings=all['app/settings']||null;S.plan=all['app/plan']||null;S.meta=all['app/meta']||{};
  S.prs={};S.ingredients={};S.logs={};S.meals={};
  Object.keys(all).forEach(function(p){
    var i=p.indexOf('/'),col=p.slice(0,i),id=p.slice(i+1);
    if(col==='prs'||col==='ingredients'||col==='logs'||col==='meals')S[col][id]=all[p];
  });
  Object.keys(S.ready).forEach(function(k){S.ready[k]=true;});
}
function allDocs(){
  var d={};
  if(S.settings)d['app/settings']=S.settings;
  if(S.plan)d['app/plan']=S.plan;
  ['prs','ingredients','logs','meals'].forEach(function(col){Object.keys(S[col]).forEach(function(id){d[col+'/'+id]=S[col][id];});});
  return d;
}
function isEmpty(){return !S.settings&&!S.plan&&!Object.keys(S.prs).length&&!Object.keys(S.ingredients).length&&!Object.keys(S.logs).length&&!Object.keys(S.meals).length;}
function setMeta(patch){Object.keys(patch).forEach(function(k){S.meta[k]=patch[k];});save('app/meta',S.meta,0);}
function requestPersist(){
  if(!(navigator.storage&&navigator.storage.persisted))return;
  navigator.storage.persisted().then(function(p){
    S.persisted=p;
    if(!p&&!isEmpty()&&navigator.storage.persist)return navigator.storage.persist().then(function(r){S.persisted=r;});
  }).catch(function(){}).then(function(){if(UI.tab==='settings')requestRender();});
}
function validPath(p){return /^(app\/(settings|plan)|(prs|ingredients|logs|meals)\/[A-Za-z0-9_\-.~:@+]{1,200})$/.test(p);}
function countsText(docs){
  var c={plan:0,prs:0,ing:0,logs:0,meals:0};
  Object.keys(docs).forEach(function(p){
    if(p==='app/plan')c.plan=1;
    else if(p.indexOf('prs/')===0)c.prs++;

  return [c.plan?'your weekly plan':'',c.prs?c.prs+(c.prs===1?' record':' records'):'',c.ing?c.ing+(c.ing===1?' ingredient':' ingredients'):'',c.logs?c.logs+(c.logs===1?' training day':' training days'):'',c.meals?c.meals+(c.meals===1?' food day':' food days'):''].filter(Boolean).join(', ');
}

/* ---------- backup ---------- */
function downloadBlob(blob,name){
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},2000);
}
function exportBackup(){
  flushAll();
  var data={app:APP_ID,schema:1,exportedAt:new Date().toISOString(),docs:allDocs()};
  var name='fitness-log-backup-'+todayY()+'.json',blob=new Blob([JSON.stringify(data)],{type:'application/json'}),file=null;
  try{file=new File([blob],name,{type:'application/json'});}catch(e){}
  function done(){setMeta({lastBackup:data.exportedAt});toast('Backup saved');render();}
  if(isIOS()&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(done).catch(function(err){
      if(err&&err.name==='AbortError')return;
      downloadBlob(blob,name);done();
    });
    return;
  }
  downloadBlob(blob,name);done();
}
$file.addEventListener('change',function(){
  var f=$file.files&&$file.files[0];
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    $file.value='';
    var d=null;try{d=JSON.parse(rd.result);}catch(e){}
    if(!d||d.app!==APP_ID||!d.docs||typeof d.docs!=='object'){toast('That file is not a backup from this app.',4000);return;}
    var docs={};
    Object.keys(d.docs).forEach(function(p){var v=d.docs[p];if(validPath(p)&&v&&typeof v==='object'&&!Array.isArray(v))docs[p]=v;});
    if(!Object.keys(docs).length){toast('That backup is empty.',4000);return;}
    UI.importPending={docs:docs,exportedAt:d.exportedAt||null};render();window.scrollTo(0,0);
  };
  rd.onerror=function(){$file.value='';toast('Could not open that file.',4000);};
  rd.readAsText(f);
});

function updStatus(){

/* ---------- training model ---------- */
function blockStartD(){var b=S.settings&&S.settings.blockStart;return b?mondayOf(parseYmd(b)):null;}
function weekNum(d){var s=blockStartD();if(!s)return null;var diff=Math.round((mondayOf(d)-s)/86400000);return Math.floor(diff/7)+1;}
function viewMonday(){return addDays(mondayOf(new Date()),UI.weekOffset*7);}
function selDate(){return addDays(viewMonday(),DAYS.indexOf(UI.selDay));}
function selY(){return ymd(selDate());}
function dayPlan(k){return (S.plan&&S.plan.days&&S.plan.days[k])||null;}
function dayItems(k){var dp=dayPlan(k);return (dp&&dp.items)||[];}
function findEx(id){return dayItems(UI.selDay).filter(function(x){return x.id===id;})[0];}
function ensurePlan(){
  if(!S.plan)S.plan={restNote:'',days:{}};
  if(!S.plan.days)S.plan.days={};
  DAYS.forEach(function(k){if(!S.plan.days[k])S.plan.days[k]={title:'',items:[]};if(!S.plan.days[k].items)S.plan.days[k].items=[];});
}
function savePlan(){save('app/plan',S.plan,500);}
function setCount(ex){return Math.max(1,Math.min(6,parseInt(ex.sets,10)||3));}
function getLog(y,create){
  if(!S.logs[y]&&create)S.logs[y]={date:y,day:dayKeyOf(parseYmd(y)),entries:{},notes:''};
  var l=S.logs[y];if(l&&!l.entries)l.entries={};return l;
}
function entryOf(y,id){var l=S.logs[y];return (l&&l.entries&&l.entries[id])||{};}
function totalSec(e){return (e.min||0)*60+(e.s||0);}
function entryHasData(e){return !!e&&((e.sets&&e.sets.some(function(v){return v!=null;}))||e.km!=null||e.min!=null||e.s!=null||e.rounds!=null);}
function hasData(l){if(!l)return false;if(l.notes&&String(l.notes).trim())return true;var en=l.entries||{};return Object.keys(en).some(function(k){return entryHasData(en[k]);});}
function lastFor(id,y){
  var keys=Object.keys(S.logs).filter(function(k){return k<y;}).sort().reverse();
  for(var i=0;i<keys.length;i++){var e=S.logs[keys[i]].entries&&S.logs[keys[i]].entries[id];if(entryHasData(e))return {date:keys[i],e:e};}
  return null;
}
function summary(ex,e){
  if(ex.type==='run'){var t=totalSec(e);return [e.km!=null?fmtKm(e.km)+' km':'',t?fmtDur(t):''].filter(Boolean).join(' in ');}
  if(ex.type==='rounds')return e.rounds!=null?e.rounds+' rounds':'';
  var s=(e.sets||[]).filter(function(v){return v!=null;});
  return s.join(', ')+(ex.type==='secs'&&s.length?' s':'');
}
function paceHtml(e){var t=totalSec(e);return (e.km>0&&t>0)?'<b>'+fmtDur(t/e.km)+'</b>/km':'<span class="dim">/km</span>';}
function hasUserLogs(){return Object.keys(S.logs).some(function(k){return hasData(S.logs[k]);})||Object.keys(S.meals).some(function(k){return (S.meals[k].meals||[]).length;});}

/* ---------- records model ---------- */
function prVal(pr,x){return pr.type==='run'?(x.km||0):(x.value||0);}
function prBest(pr){
  var h=pr.history||[],b=null;
  h.forEach(function(x){
    if(!b){b=x;return;}
    var v=prVal(pr,x),bv=prVal(pr,b);
    if(v>bv)b=x;
    else if(pr.type==='run'&&v===bv&&x.sec&&(!b.sec||x.sec<b.sec))b=x;
  });
  return b;
}
function sortHist(pr){
  var h=(pr.history||[]).map(function(x,i){return [x,i];});
  h.sort(function(a,b){var da=a[0].date||'',dbb=b[0].date||'';return da<dbb?-1:da>dbb?1:a[1]-b[1];});
  pr.history=h.map(function(p){return p[0];});
}
function whenLabel(x){if(x.date)return fmtDate(parseYmd(x.date));if(x.week)return 'Week '+x.week;return 'Earlier';}
function noteFor(pr,x){
  if(pr.type==='run')return [x.sec?fmtDur(x.sec)+', '+paceStr(x.km,x.sec):'',x.note||''].filter(Boolean).join('. ');
  return x.note||'';
}
function spark(vals){
  if(vals.length<2)return '';
  var W=112,H=38,P=4,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
  var pts=vals.map(function(v,i){return [P+i*(W-2*P)/(vals.length-1),mx===mn?H/2:H-P-(v-mn)/rg*(H-2*P)];});
  var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var area=line+' L'+pts[pts.length-1][0].toFixed(1)+' '+H+' L'+pts[0][0].toFixed(1)+' '+H+' Z';
  var e=pts[pts.length-1];
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+area+'" fill="var(--accent-soft)" stroke="none"/><path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/></svg>';
}

/* ---------- food model ---------- */
function mealsDoc(y,create){
  if(!S.meals[y]&&create)S.meals[y]={date:y,meals:[]};
  if(S.meals[y]&&!S.meals[y].meals)S.meals[y].meals=[];
  return S.meals[y];
}
function totalsOf(meals){
  var t={kcal:0,p:0,c:0,f:0};
  (meals||[]).forEach(function(m){(m.items||[]).forEach(function(it){t.kcal+=it.kcal||0;t.p+=it.p||0;t.c+=it.c||0;t.f+=it.f||0;});});
  return t;
}
function scale(ing,g){var k=g/100;return {kcal:(ing.kcal||0)*k,p:(ing.p||0)*k,c:(ing.c||0)*k,f:(ing.f||0)*k};}
function per100(x){return fmtInt(x.kcal)+' kcal, P '+fmtG(x.p)+', C '+fmtG(x.c)+', F '+fmtG(x.f);}
function lastUsedMap(){
  var m={};
  Object.keys(S.meals).forEach(function(y){(S.meals[y].meals||[]).forEach(function(ml){(ml.items||[]).forEach(function(it){if(it.ing&&(!m[it.ing]||m[it.ing]<y))m[it.ing]=y;});});});
  return m;
}
function ingSorted(filter,alpha){
  var last=alpha?{}:lastUsedMap(),q=(filter||'').trim().toLowerCase();
  return Object.keys(S.ingredients).map(function(id){return [id,S.ingredients[id]];})
    .filter(function(p){return !q||String(p[1].name).toLowerCase().indexOf(q)>-1;})
    .sort(function(a,b){return ((last[b[0]]||'').localeCompare(last[a[0]]||''))||String(a[1].name).localeCompare(String(b[1].name));});
}
function hasTargets(t){return !!(t&&(t.kcal||t.protein||t.carbs||t.fat));}

function prCard(id,pr){
  var hist=pr.history||[],b=prBest(pr),unit=pr.type==='secs'?'s':(pr.type==='run'?'km':'reps'),bestHtml;
  if(!b)bestHtml='<p class="hint">No result yet. Log your first test.</p>';
  else{
    var bv=prVal(pr,b),prev=hist.map(function(x){return prVal(pr,x);}).filter(function(v){return v<bv;}),pv=prev.length?Math.max.apply(null,prev):null;
    var show=pr.type==='run'?fmtKm:function(v){return String(v);};
    bestHtml='<div class="pr-best"><span class="big">'+show(bv)+'</span><span class="unit">'+unit+'</span></div>';
    if(pr.type==='run'&&b.sec)bestHtml+='<div class="delta">'+fmtDur(b.sec)+', '+paceStr(b.km,b.sec)+'</div>';
    if(pv!=null)bestHtml+='<div class="delta"><b>+'+show(Math.round((bv-pv)*100)/100)+'</b> over the previous best of '+show(pv)+'</div>';
  }
  var runMax=-Infinity,marks=hist.map(function(x){var v=prVal(pr,x),isPr=v>runMax;if(isPr)runMax=v;return isPr;});
  var rowsAll=hist.map(function(x,i){return {x:x,isPr:marks[i]};}).reverse();
  var showAll=!!UI.prAll[id],rows=showAll?rowsAll:rowsAll.slice(0,5);
  var rowsHtml=rows.map(function(r){
    return '<li><span class="h-when">'+esc(whenLabel(r.x))+'</span><span class="h-val'+(r.isPr?' is-pr':'')+'">'+(pr.type==='run'?fmtKm(r.x.km)+' km':esc(r.x.value))+'</span><span class="h-note">'+esc(noteFor(pr,r.x))+'</span></li>';
  }).join('');
  var more=rowsAll.length>5?'<button class="link" data-act="pr-all" data-id="'+esc(id)+'">'+(showAll?'Show fewer':'Show all '+rowsAll.length)+'</button>':'';
  var foot;
  if(UI.prForm&&UI.prForm.id===id)foot=prLogForm(pr);
  else if(UI.prDel===id)foot='<div class="confirm"><span>Delete '+esc(pr.name)+' and its history?</span><div class="row"><button class="btn danger" data-act="pr-del-yes" data-id="'+esc(id)+'">Delete</button><button class="btn ghost" data-act="pr-del-no">Cancel</button></div></div>';
  else foot='<div class="row between"><button class="btn primary small" data-act="pr-log" data-id="'+esc(id)+'">Log result</button><button class="btn ghost danger small" data-act="pr-del" data-id="'+esc(id)+'">Delete</button></div>';
  return '<section class="card">'+
    '<div class="pr-top"><div class="min0"><div class="pr-name">'+esc(pr.name)+'</div>'+(pr.test?'<div class="pr-test">'+esc(pr.test)+'</div>':'')+'</div>'+spark(hist.map(function(x){return prVal(pr,x);}))+'</div>'+
    '<div>'+bestHtml+'</div>'+
    (rowsHtml?'<ul class="hist">'+rowsHtml+'</ul>':'')+more+foot+'</section>';
}

  return '<div class="form-block"><p class="hint">Targets are optional. Leave a field empty to hide its bar.</p><div class="grid2">'+tfld('Calories (kcal)','tg-kcal','kcal',f.kcal)+tfld('Protein (g)','tg-p','protein',f.protein)+tfld('Carbs (g)','tg-c','carbs',f.carbs)+tfld('Fat (g)','tg-f','fat',f.fat)+'</div><div class="row"><button class="btn primary" data-act="targets-save">Save targets</button><button class="btn ghost" data-act="targets-cancel">Cancel</button></div></div>';
}
function mealCard(m){
  var t=totalsOf([m]);
  var items=(m.items||[]).map(function(it,i){
    return '<li><div class="it-name">'+esc(it.name)+'<span class="it-g">'+fmtG(it.g)+' g</span></div><button class="icon-btn sm" data-act="rm-item" data-meal="'+esc(m.id)+'" data-i="'+i+'" aria-label="Remove '+esc(it.name)+'">'+ICON.x+'</button><div class="it-mac">'+fmtInt(it.kcal)+' kcal, P '+fmtG(it.p)+', C '+fmtG(it.c)+', F '+fmtG(it.f)+'</div></li>';
  }).join('');
  var body;
  if(UI.addTo===m.id)body=pickerHtml(m);
  else if(UI.delMeal===m.id)body='<div class="confirm"><span>Delete '+esc(m.name)+' and its ingredients?</span><div class="row"><button class="btn danger" data-act="meal-del-yes" data-meal="'+esc(m.id)+'">Delete</button><button class="btn ghost" data-act="meal-del-no">Cancel</button></div></div>';
  else body='<div class="row between"><button class="btn" data-act="pick-open" data-meal="'+esc(m.id)+'">Add ingredient</button><button class="btn ghost danger small" data-act="meal-del" data-meal="'+esc(m.id)+'">Delete meal</button></div>';
  return '<section class="card"><div class="meal-head"><h3>'+esc(m.name)+'</h3><span class="meal-tot">'+fmtInt(t.kcal)+' kcal, '+fmtG(t.p)+' g protein</span></div>'+(items?'<ul class="items">'+items+'</ul>':'')+body+'</section>';
}
function previewHtml(ing){
  var g=num(UI.grams);
  if(!ing)return '';
  if(!(g>0))return 'Enter the weight to see the values.';
  var v=scale(ing,g);
  return '<b>'+fmtInt(v.kcal)+'</b> kcal<br>P '+fmtG(v.p)+' g, C '+fmtG(v.c)+' g, F '+fmtG(v.f)+' g';
}
function ingOptions(){
  if(!Object.keys(S.ingredients).length)return '<p class="hint">Your ingredient list is empty. Add one with the values from its nutrition label.</p>';
  var list=ingSorted(UI.ingSearch,false);
  if(!list.length)return '<p class="hint">No match. Add it as a new ingredient.</p>';
  return list.slice(0,40).map(function(p){return '<button class="ing-opt" data-act="pick-ing" data-id="'+esc(p[0])+'"><span class="n">'+esc(p[1].name)+'</span><span class="m">'+fmtInt(p[1].kcal)+' kcal, P '+fmtG(p[1].p)+'</span></button>';}).join('');
}
function pickerHtml(m){
  var ing=UI.pick&&S.ingredients[UI.pick];
  if(ing){
    return '<div class="picker"><div class="pick-sel"><div class="min0"><div class="it-name">'+esc(ing.name)+'</div><div class="it-mac">Per 100 g: '+per100(ing)+'</div></div><button class="btn ghost small" data-act="pick-back">Change</button></div>'+
      '<div class="grams-row"><label class="fld" for="grams"><span>Weight (g)</span><input class="num" id="grams" type="text" inputmode="decimal" autocomplete="off" data-k="grams" value="'+esc(UI.grams)+'" placeholder=" "></label><div class="preview" id="preview">'+previewHtml(ing)+'</div></div>'+
      '<div class="row"><button class="btn primary" data-act="pick-add">Add to '+esc(m.name)+'</button><button class="btn ghost" data-act="pick-close">Done</button></div></div>';
  }
  return '<div class="picker"><label class="fld" for="ingsearch"><span>Add to '+esc(m.name)+'</span><input class="txt" id="ingsearch" type="search" data-k="ingsearch" value="'+esc(UI.ingSearch)+'" placeholder="Search your ingredients" autocomplete="off"></label>'+
    '<div class="ing-list" id="inglist">'+ingOptions()+'</div>'+
    '<div class="row between"><button class="btn small" data-act="ing-new-from-pick">New ingredient</button><button class="btn ghost small" data-act="pick-close">Done</button></div></div>';
}
function newMealForm(){
  return '<section class="card"><h3>Add meal</h3><div class="chips">'+MEAL_NAMES.map(function(n){return '<button class="btn small" data-act="meal-add" data-name="'+n+'">'+n+'</button>';}).join('')+'</div>'+
    '<div class="row nowrap"><input class="txt" id="meal-name" data-k="mealname" value="'+esc(UI.mealName)+'" placeholder="Other name, like Post-workout" aria-label="Meal name"><button class="btn" data-act="meal-add-custom">Add</button></div>'+
    '<div class="row"><button class="btn ghost small" data-act="meal-new-cancel">Cancel</button></div></section>';
}
function ingRows(){
  if(!Object.keys(S.ingredients).length)return '<div class="empty"><strong>No ingredients yet</strong>Add the foods you eat often with the values per 100 g from the label. Logging a meal then takes a few taps.</div>';
  var list=ingSorted(UI.ingFilter,true);
  if(!list.length)return '<div class="empty">No ingredient matches that search.</div>';
  return list.map(function(p){return '<button class="ing-row'+(UI.ingForm&&UI.ingForm.id===p[0]?' sel':'')+'" data-act="ing-edit" data-id="'+esc(p[0])+'"><span class="n">'+esc(p[1].name)+(p[1].example?' <span class="chip">Example</span>':'')+'</span><span class="m">Per 100 g: '+per100(p[1])+'</span></button>';}).join('');
}
function ifld(label,id,f,v){return '<label class="fld" for="'+id+'"><span>'+label+'</span><input class="txt" id="'+id+'" inputmode="decimal" autocomplete="off" data-k="if" data-f="'+f+'" value="'+esc(v==null?'':v)+'"></label>';}
function ingFormHtml(){
  var f=UI.ingForm,isEx=f.id&&S.ingredients[f.id]&&S.ingredients[f.id].example;
  var actions=f.confirmDel?
    '<div class="confirm"><span>Delete '+esc(f.name||'this ingredient')+'? Meals you already logged keep their values.</span><div class="row"><button class="btn danger" data-act="ing-del-yes">Delete</button><button class="btn ghost" data-act="ing-del-no">Cancel</button></div></div>':
    '<div class="row between"><div class="row"><button class="btn primary" data-act="ing-save">'+(f.returnTo?'Save and use':'Save')+'</button><button class="btn ghost" data-act="ing-cancel">Cancel</button></div>'+(f.id?'<button class="btn ghost danger small" data-act="ing-del">Delete</button>':'')+'</div>';
  return '<section class="card"><h3>'+(f.id?'Edit ingredient':'New ingredient')+'</h3><p class="hint">'+(isEx?'Example values from a standard food table; replace them with the numbers on your packaging. ':'')+'Enter the values per 100 g from the nutrition label.</p>'+
    '<label class="fld" for="if-name"><span>Name</span><input class="txt" id="if-name" data-k="if" data-f="name" value="'+esc(f.name)+'" placeholder="Greek yogurt 2%"></label>'+
    '<div class="grid2">'+ifld('Calories (kcal)','if-kcal','kcal',f.kcal)+ifld('Protein (g)','if-p','p',f.p)+ifld('Carbs (g)','if-c','c',f.c)+ifld('Fat (g)','if-f','f',f.f)+'</div>'+
    (f.err?'<p class="err">'+esc(f.err)+'</p>':'')+actions+'</section>';
}
function renderIngredients(){
  var h='';
  if(UI.ingForm)h+=ingFormHtml();
  else h+='<div class="row nowrap"><input class="txt" type="search" id="ingfilter" data-k="ingfilter" value="'+esc(UI.ingFilter)+'" placeholder="Search ingredients" autocomplete="off" aria-label="Search ingredients"><button class="btn primary" data-act="ing-new">New</button></div>';
  h+='<div class="sheet" id="ingrows">'+ingRows()+'</div>';
  return h;
}

/* ---------- inputs ---------- */
function onLogInput(t){
  var y=selY(),ex=findEx(t.getAttribute('data-ex'));if(!ex)return;
  var log=getLog(y,true),e=log.entries[ex.id]=log.entries[ex.id]||{};
  e.name=ex.name;e.type=ex.type;
  var k=t.getAttribute('data-k'),v=num(t.value);
  if(k==='set'){
    var n=setCount(ex);e.sets=e.sets||[];
    for(var i=0;i<n;i++){if(e.sets[i]===undefined)e.sets[i]=null;}
    e.sets[+t.getAttribute('data-i')]=v==null?null:Math.round(v);
  }else if(k==='km')e.km=v;
  else if(k==='min')e.min=v==null?null:Math.round(v);
  else if(k==='s')e.s=v==null?null:Math.round(v);
  else if(k==='rounds')e.rounds=v==null?null:Math.round(v);
  log.week=weekNum(parseYmd(y));
  save('logs/'+y,log);
  var row=t.closest('.ex');
  if(row){
    var slot=row.querySelector('.pr-slot'),foot=row.querySelector('.ex-foot'),pace=row.querySelector('.pace');
    if(slot)slot.innerHTML=prPromptHtml(ex,y,e);
    if(foot)foot.hidden=!(foot.querySelector('.last-txt').textContent.trim()||(slot&&slot.innerHTML));
    if(pace)pace.innerHTML=paceHtml(e);
  }
  updDot();
}
function updDot(){var dot=document.querySelector('.day.sel .d-dot');if(dot)dot.classList.toggle('on',hasData(S.logs[selY()]));}
var INPUT={};
INPUT.set=INPUT.km=INPUT.min=INPUT.s=INPUT.rounds=onLogInput;

INPUT.ingfilter=function(t){UI.ingFilter=t.value;var el=document.getElementById('ingrows');if(el)el.innerHTML=ingRows();};
INPUT.grams=function(t){UI.grams=t.value;var el=document.getElementById('preview');if(el)el.innerHTML=previewHtml(S.ingredients[UI.pick]);};

function handleInput(t){var k=t.getAttribute&&t.getAttribute('data-k');if(k&&INPUT[k])INPUT[k](t);}
document.addEventListener('input',function(e){var t=e.target;if(t.type==='checkbox'||t.tagName==='SELECT'||t.type==='file')return;handleInput(t);});
document.addEventListener('change',function(e){var t=e.target;if(t.type==='checkbox'||t.tagName==='SELECT')handleInput(t);});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act');if(ACT[a]){e.preventDefault();ACT[a](b,e);}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var id=e.target&&e.target.id;
  if(id==='grams'){e.preventDefault();ACT['pick-add']();}
  else if(id==='meal-name'){e.preventDefault();ACT['meal-add-custom']();}
  else if(id==='ingsearch'){e.preventDefault();var l=ingSorted(UI.ingSearch,false);if(l.length===1){UI.pick=l[0][0];UI.grams='';render();focusLater('grams');}}
});
/* Re-check the date when the app comes back to the front, so "today" stays right overnight. */
var lastDay=todayY();
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  var t=todayY();if(t!==lastDay){lastDay=t;UI.weekOffset=0;UI.selDay=dayKeyOf(new Date());UI.foodDate=t;requestRender();}
});

/* ---------- start ---------- */
render();
openIdb().then(function(h){
  KV=h?idbKV(h):(lsWorks()?lsKV():memKV());
  return KV.all();
}).then(function(all){
  S.storeState=KV.kind==='mem'?'memory':'ok';loadDocs(all);render();requestPersist();
}).catch(function(){
  KV=memKV();S.storeState='memory';loadDocs({});render();
});
})();
</script>
</body>
</html>

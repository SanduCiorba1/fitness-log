<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casian Fitness Log</title>
<meta name="description" content="Weekly training plan, personal records and meal tracking with label scanning, stored on your phone.">
<meta name="theme-color" content="#EDF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1211" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column; sticky header carries the week or day; fixed bottom tab bar; training days read like a printed session sheet with paired moves bracketed together */
:root{
  --bg:#EDF0EE;
  --surface:#FFFFFF;
  --sunk:#E3E8E5;
  --ink:#141D1A;
  --muted:#58655F;
  --line:#D1D9D5;
  --accent:#2446C4;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCE3FA;
  --gold:#946800;
  --gold-soft:#F5E8C2;
  --danger:#B3261E;
  --c-p:#2446C4;
  --c-c:#2C8770;
  --c-f:#B3741A;
  --shadow:rgba(10,20,16,.08);
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1211; --surface:#161D1B; --sunk:#0A0E0D; --ink:#E4EBE8; --muted:#97A39E; --line:#2A3431;
    --accent:#8DA4FF; --accent-ink:#0A1233; --accent-soft:#1D2950; --gold:#E6B84C; --gold-soft:#3A3017;
    --danger:#F2877F; --c-p:#8DA4FF; --c-c:#5BC4A6; --c-f:#E3A955; --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:620px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.row.nowrap .txt{flex:1}
.row.tight{gap:2px}
.min0{min-width:0}
.hint{margin:0;font-size:14px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.center{text-align:center}
.err{margin:0;color:var(--danger);font-size:14px;font-weight:500}
.dim{color:var(--muted)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 12px;border-bottom:1px solid var(--line)}
.top-grid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top-right{display:flex;align-items:center;gap:2px;padding-bottom:2px;margin-right:-8px}
.eyebrow{font:600 12px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.title-row{display:flex;align-items:center;gap:0;margin:2px 0 0 -8px}
.title-row.nonav{margin-left:0}
.h-title{margin:0;font:700 34px/1 var(--font-display);letter-spacing:.005em;text-wrap:balance;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px;margin-top:2px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.link{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:600 14px var(--font-body)}
.status{font:600 11.5px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;padding-right:2px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-c)}
.status[data-state="busy"]::before{background:var(--muted)}
.status[data-state="err"]{color:var(--danger)}
.status[data-state="err"]::before{background:var(--danger)}
.icon-btn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}

/* Main + tab bar */
main{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px var(--font-body);letter-spacing:.07em;text-transform:uppercase}
.tab[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:600 14px var(--font-body);max-width:calc(100% - 32px);width:max-content;text-align:center;box-shadow:0 6px 20px var(--shadow)}

/* Buttons and fields */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:600 15px/1.2 var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 10px;font-size:14px}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--ink);width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;flex:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn.sm{width:34px;height:34px;color:var(--muted)}
.icon-btn[disabled]{opacity:.3;cursor:default}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font:600 11px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fld>span .chip{letter-spacing:.05em}
.fld>span .u{text-transform:none;letter-spacing:0}
.txt{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font:500 16px var(--font-body);color:var(--ink)}
textarea.txt{min-height:76px;resize:vertical;line-height:1.4}
.txt.from-scan{background:var(--gold-soft);border-color:var(--gold)}
.txt.from-check{border-color:var(--danger);border-width:2px}
.chip.danger{background:var(--danger);color:#fff}
.num{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 4px;text-align:center;font:700 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.num::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.check{display:flex;align-items:center;gap:8px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3,.block h3{margin:0;font:700 21px/1.1 var(--font-display);letter-spacing:.01em}
.card h4{margin:0;font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.notice{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.notice .hint{color:var(--ink)}
.empty{padding:20px 16px;color:var(--muted);font-size:15px}
.empty strong{display:block;color:var(--ink);font:700 21px/1.15 var(--font-display);margin-bottom:4px}
.card .empty{padding:0}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--sunk);font-size:15px}
.form-block{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.tag{font:700 10.5px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--ink);color:var(--bg);flex:none}
.tag.soft{background:var(--sunk);color:var(--muted)}
.chip{font:700 10.5px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);vertical-align:2px}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.welcome h2{margin:0;font:700 30px/1.05 var(--font-display);text-wrap:balance}
.welcome p{margin:0;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-top:1px solid var(--line);padding-top:10px}
.kv span{color:var(--muted);flex:none}
.kv b{text-align:right;font-weight:600;min-width:0}
.panel{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:10px;background:var(--sunk)}
.panel .txt{background:var(--surface)}
.panel .txt.from-scan{background:var(--gold-soft)}

/* Train */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);min-width:0}
.d-name{font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.d-num{font:700 21px/1 var(--font-display);font-variant-numeric:tabular-nums}
.day.rest .d-num{color:var(--muted)}
.day.today{border-color:var(--ink);border-width:2px;padding:7px 0 6px}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel .d-name,.day.sel .d-num{color:inherit}
.day.sel .d-name{opacity:.75}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dayhead h2{margin:0;font:700 27px/1.05 var(--font-display)}
.daynote{margin:-4px 0 0;font-size:14px;color:var(--muted)}
.restnote{margin:-6px 0 0;font-size:13.5px;color:var(--muted)}
.ex{padding:14px;display:flex;gap:12px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.ex-name{font:600 17px/1.25 var(--font-body);display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere;flex-wrap:wrap}
.ex-meta{font-size:13.5px;color:var(--muted);white-space:nowrap}
.ex-note{font-size:13.5px;color:var(--muted)}
.ab{flex:none;width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/26px var(--font-display);text-align:center;margin-top:1px}
.pair{border-top:1px solid var(--line);border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface))}
.pair:first-child{border-top:0}
.pair-head{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:10px 14px 0}
.pair .ex{border-top:1px dashed var(--line)}
.pair .ex:first-of-type{border-top:0}
.lr{padding:16px;display:flex;flex-direction:column;gap:10px}
.lr-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lr-km{font:700 54px/.95 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lr-unit{font:600 16px var(--font-display);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lr-kind{font:700 14px var(--font-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.lr-kind.easy{background:var(--c-c);color:#fff}
.lr-why{font-size:15px}
.lr-splits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lr-split{padding:10px;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;gap:2px;min-width:0}
.lr-split b{font:700 20px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.lr-split span{font-size:12.5px;color:var(--muted)}
.lr-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.block{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.pe{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pe:first-child{border-top:0}
.pe-grid{display:grid;grid-template-columns:minmax(0,1fr) 4.5rem;gap:8px}
.checks{display:flex;gap:14px;flex-wrap:wrap}

/* Records */
.pr-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pr-name{font:700 23px/1.05 var(--font-display)}
.pr-test{font-size:13.5px;color:var(--muted);margin-top:3px}
.spark{flex:none;overflow:visible}
.pr-best{display:flex;align-items:baseline;gap:6px}
.big{font:700 54px/.95 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.unit{font:600 16px var(--font-display);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.delta{font-size:14px;color:var(--muted);margin-top:4px}
.delta b{color:var(--gold);font-weight:700}
.hist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.hist li{display:grid;grid-template-columns:6.2em 4.6em minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.h-when{color:var(--muted);font-variant-numeric:tabular-nums}
.h-val{font:700 18px var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.h-val.is-pr::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:2px}
.h-note{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.legend{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.run-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.grams-row{display:grid;grid-template-columns:minmax(0,8rem) minmax(0,1fr);gap:12px;align-items:end}

/* Food */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:9px;font:600 15px var(--font-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.kcal-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.of{color:var(--muted);font-size:15px}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.m-name{font:600 11px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.m-val{font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.m-val small{font:500 13px var(--font-body);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;border-radius:3px}
.details{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.details li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-variant-numeric:tabular-nums}
.details li span:first-child{color:var(--muted)}
.details li.head{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:0;padding-top:12px;padding-bottom:2px}
.details b{font-weight:600}
.details small{color:var(--muted);font-size:12.5px;margin-left:6px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.meal-tot{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.it-name{grid-column:1;grid-row:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.it-g{font-weight:500;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.it-mac{grid-column:1;grid-row:2;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.items .icon-btn{grid-column:2;grid-row:1 / span 2}
.picker{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.pick-sel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.pick-sel .it-mac{margin-top:2px}
.ing-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.ing-opt{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--ink)}
.ing-opt .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ing-opt .m{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.preview{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.preview b{font:700 22px var(--font-display);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ing-row{appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 14px;color:var(--ink)}
.ing-row:first-child{border-top:0}
.ing-row .n{font-weight:600;overflow-wrap:anywhere}
.ing-row .m{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ing-row.sel{background:var(--accent-soft)}
.scan{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--sunk)}
.scan-status{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.scan-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.scan-bar>span{display:block;height:100%;background:var(--accent)}
.crop-stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px;overflow:hidden;background:#111;line-height:0;scroll-margin-top:calc(140px + env(safe-area-inset-top,0px))}
.crop-stage img{display:block;width:100%;height:auto;max-width:100%}
.crop-box{position:absolute;border:2px solid var(--gold);box-shadow:0 0 0 4000px rgba(0,0,0,.5);box-sizing:border-box;cursor:move}
.crop-h{position:absolute;width:48px;height:48px;margin:-24px;display:grid;place-items:center;cursor:pointer}

function openIdb(){
  return new Promise(function(res){
    if(!window.indexedDB)return res(null);
    var r;try{r=indexedDB.open(APP_ID,1);}catch(e){return res(null);}
    r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains('docs'))r.result.createObjectStore('docs');};
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){res(null);};
    r.onblocked=function(){res(null);};
  });
}
function idbKV(h){
  function tx(fn){return new Promise(function(res,rej){var t=h.transaction('docs','readwrite');fn(t.objectStore('docs'));t.oncomplete=function(){res();};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error||new Error('aborted'));};});}
  return {kind:'idb',
    all:function(){return new Promise(function(res,rej){var out={},t=h.transaction('docs','readonly'),req=t.objectStore('docs').openCursor();req.onsuccess=function(){var c=req.result;if(c){out[c.key]=c.value;c.continue();}};t.oncomplete=function(){res(out);};t.onerror=function(){rej(t.error);};});},
    put:function(k,v){return tx(function(st){st.put(v,k);});},
    del:function(k){return tx(function(st){st.delete(k);});},
    replaceAll:function(docs){return tx(function(st){st.clear();Object.keys(docs).forEach(function(k){st.put(docs[k],k);});});}
  };
}

    put:function(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));return Promise.resolve();}catch(e){return Promise.reject(e);}},

  if(vals.length<2)return '';

  var pts=vals.map(function(v,i){return [P+i*(W-2*P)/(vals.length-1),mx===mn?H/2:H-P-(v-mn)/rg*(H-2*P)];});
  var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var area=line+' L'+pts[pts.length-1][0].toFixed(1)+' '+H+' L'+pts[0][0].toFixed(1)+' '+H+' Z';
  var e=pts[pts.length-1];
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+area+'" fill="var(--accent-soft)" stroke="none"/><path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/></svg>';

function prCard(id,pr){
  var hist=pr.history||[],b=prBest(pr),unit=pr.type==='secs'?'s':(pr.type==='run'?'km':(pr.type==='kg'?'kg':'reps')),bestHtml;
  if(!b)bestHtml='<p class="hint">No result yet. Log your first test.</p>';
  else{
    var bv=prVal(pr,b),prev=hist.map(function(x){return prVal(pr,x);}).filter(function(v){return v<bv;}),pv=prev.length?Math.max.apply(null,prev):null;
    var show=pr.type==='run'?fmtKm:function(v){return String(v);};
    bestHtml='<div class="pr-best"><span class="big">'+show(bv)+'</span><span class="unit">'+unit+'</span></div>';
    if(pr.type==='run'&&b.sec)bestHtml+='<div class="delta">'+fmtDur(b.sec)+', '+paceStr(b.km,b.sec)+'</div>';
    if(pv!=null)bestHtml+='<div class="delta"><b>+'+show(Math.round((bv-pv)*100)/100)+'</b> over the previous best of '+show(pv)+'</div>';
  }
  var runMax=-Infinity,marks=hist.map(function(x){var v=prVal(pr,x),isPr=v>runMax;if(isPr)runMax=v;return isPr;});
  var rowsAll=hist.map(function(x,i){return {x:x,isPr:marks[i]};}).reverse();
  var showAll=!!UI.prAll[id],rows=showAll?rowsAll:rowsAll.slice(0,5);
  var rowsHtml=rows.map(function(r){
    return '<li><span class="h-when">'+esc(whenLabel(r.x))+'</span><span class="h-val'+(r.isPr?' is-pr':'')+'">'+(pr.type==='run'?fmtKm(r.x.km)+' km':esc(r.x.value))+'</span><span class="h-note">'+esc(noteFor(pr,r.x))+'</span></li>';
  }).join('');
  var more=rowsAll.length>5?'<button class="link" data-act="pr-all" data-id="'+esc(id)+'">'+(showAll?'Show fewer':'Show all '+rowsAll.length)+'</button>':'';
  var foot;
  if(UI.prForm&&UI.prForm.id===id)foot=prLogForm(pr);
  else if(UI.prDel===id)foot='<div class="confirm"><span>Delete '+esc(pr.name)+' and its history?</span><div class="row"><button class="btn danger" data-act="pr-del-yes" data-id="'+esc(id)+'">Delete</button><button class="btn ghost" data-act="pr-del-no">Cancel</button></div></div>';
  else foot='<div class="row between"><button class="btn primary small" data-act="pr-log" data-id="'+esc(id)+'">Log result</button><button class="btn ghost danger small" data-act="pr-del" data-id="'+esc(id)+'">Delete</button></div>';
  return '<section class="card">'+
    '<div class="pr-top"><div class="min0"><div class="pr-name">'+esc(pr.name)+'</div>'+(pr.test?'<div class="pr-test">'+esc(pr.test)+'</div>':'')+'</div>'+spark(hist.map(function(x){return prVal(pr,x);}))+'</div>'+
    '<div>'+bestHtml+'</div>'+
    (rowsHtml?'<ul class="hist">'+rowsHtml+'</ul>':'')+more+foot+'</section>';

ACT['pick-add']=function(){
  var ing=pickIng(UI.pick),g=num(UI.grams);if(!ing)return;
  if(!(g>0)){toast('Enter the amount in grams');focusLater('grams');return;}
  var md=mealsDoc(UI.foodDate,true),m=md.meals.filter(function(x){return x.id===UI.addTo;})[0];if(!m)return;
  var ck=UI.cook,cr=null,name=ing.name,base=ing,isMk=UI.pick.indexOf('mk:')===0,isRc=UI.pick.indexOf('rc:')===0;
  if(ck&&ck.mode==='cooked'&&ing.basis!=='ml'){
    cr=cookRatio(UI.pick);
    if(!cr){toast('Enter the batch weights, raw and cooked',3000);focusLater('cook-raw');return;}
    if(cr.src==='batch')cookSave(UI.pick,{raw:num(ck.braw),cooked:num(ck.bcooked),at:UI.foodDate});
    if(cr.src==='typical'&&!isMk&&ck.kind)cookSaveKind(UI.pick,ck.kind);
    base=cookedVals(ing,cr.r);name=ing.name.replace(/,\s*raw$/i,'')+(cr.approx?', cooked (approx.)':', cooked');
  }
  var v=scale(base,g);m.items=m.items||[];
  var it={name:name,g:r1(g)};
  if(isMk)it.mk=UI.pick.slice(3);else if(isRc)it.rc=UI.pick.slice(3);else it.ing=UI.pick;
  if(cr)it.cook={r:r3(cr.r),approx:!!cr.approx,raw:r1(g/cr.r)};
  LABEL.forEach(function(l){it[l.k]=v[l.k];});if(Object.keys(v.micros).length)it.micros=v.micros;
  m.items.push(it);
  save('meals/'+UI.foodDate,md,0);toast('Added '+fmtG(g)+' '+(ing.basis==='ml'?'ml':'g')+' '+name);UI.pick=null;UI.grams='';UI.ingSearch='';UI.cook=null;render();
};

ACT['ing-save']=function(){
  var f=UI.ingForm,name=(f.name||'').trim(),kcal=num(f.kcal);
  if(!name){f.err='Give the ingredient a name.';render();return;}
  if(kcal==null){f.err='Enter the calories per 100 g.';render();return;}
  var id=f.id||('ing-'+uid()),old=S.ingredients[f.id]||{};
  var x={name:name,basis:f.basis==='ml'?'ml':'g',example:false,updated:Date.now(),source:(f.scan&&f.scan.done)?'scan':(old.source==='scan'||old.source==='market'?old.source:'label'),micros:{}};
  LABEL.forEach(function(l){var v=num(f[l.k]);x[l.k]=l.k==='kcal'?kcal:(['p','c','f'].indexOf(l.k)>-1?(v==null?0:v):v);});
  Object.keys(f.micros||{}).forEach(function(m){var v=num(f.micros[m]);if(MICRO_BY[m]&&v!=null)x.micros[m]=v;});
  if(old.market)x.market=old.market;
  var cr=num(f.craw),cc=num(f.ccooked),oc=old.cook||{};
  if(f.basis!=='ml'&&((cr>0&&cc>0)||f.ckind)){
    x.cook={};
    if(cr>0&&cc>0){x.cook.raw=cr;x.cook.cooked=cc;x.cook.at=(oc.raw===cr&&oc.cooked===cc&&oc.at)||todayY();}
    if(f.ckind&&COOK_KIND[f.ckind])x.cook.kind=f.ckind;
  }
  S.ingredients[id]=x;
  if(f.scanRecId)scanLogPatch(f.scanRecId,{saved:clone(x),savedAt:new Date().toISOString()});
  save('ingredients/'+id,x,0);toast('Ingredient saved');
  pendClear();var r=f.returnTo;UI.ingForm=null;
  if(r){UI.foodView='log';UI.foodDate=r.date;UI.addTo=r.meal;UI.pick=id;UI.grams='';render();focusLater('grams');return;}
  render();
};

/* ---------- progress photos (beta, 1.2.13) ----------
   Weekly albums: each week holds one photo per pose (the six of a classic progress set: front, both sides and back
   relaxed, front and back flexed) and any number of Unorganized ones. Week 1 is the week of the earliest photo, so the
   weeks count from the first photos taken; with no photo yet, this week is Week 1. A photo goes to the week on screen.
   The photos live in a database of their own on this phone (casian-fitness-log-photos: 'photos' holds each photo's week,
   pose, dates, size and a thumbnail of 360 pixels; 'files' holds the photo, at up to 1920 pixels on its long side). They
   are not in the backup file, which would grow too large to keep: Save all photos makes a zip of the JPEG files with
   photos.json (week, pose and dates of each) and Load photos brings such a zip back. Nothing leaves the phone otherwise.
   While the camera app is open Android may close the browser; the pose being taken is then kept for 30 minutes, so the
   app opens again on that week with a note. */
var PH_POSES=[
  {id:'front',name:'Front, relaxed',file:'Front relaxed',how:'Face the camera, arms by your sides, standing tall without flexing'},
  {id:'front-flex',name:'Front, flexed',file:'Front flexed',how:'Front double biceps: arms up and bent, abs tight'},
  {id:'side-l',name:'Left side',file:'Left side',how:'Left side to the camera, arms straight forward at shoulder height, relaxed'},
  {id:'side-r',name:'Right side',file:'Right side',how:'Right side to the camera, arms straight forward at shoulder height, relaxed'},
  {id:'back',name:'Back, relaxed',file:'Back relaxed',how:'Back to the camera, arms by your sides'},
  {id:'back-flex',name:'Back, flexed',file:'Back flexed',how:'Back double biceps: arms up and bent, shoulder blades spread'}
];
var PH_UNORG={id:'unorg',name:'Unorganized',file:'Unorganized',how:'Any other photo of the week'};

/* the photos' own database: one transaction per call, closed when done */
function phTx(stores,mode,fn){
  return new Promise(function(res,rej){
    if(!window.indexedDB)return rej(new Error('this browser has no database'));
    var rq;try{rq=indexedDB.open(PH_DB,1);}catch(e){return rej(e);}
    rq.onupgradeneeded=function(){
      var db=rq.result;
      if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});
      if(!db.objectStoreNames.contains('files'))db.createObjectStore('files');
    };
    rq.onerror=function(){rej(rq.error);};
    rq.onblocked=function(){rej(new Error('the database is busy'));};
    rq.onsuccess=function(){
      var db=rq.result,tx,out;
      try{tx=db.transaction(stores,mode);out=fn(tx);}catch(e){db.close();return rej(e);}
      tx.oncomplete=function(){db.close();res(out&&typeof out==='object'&&('result' in out)?out.result:out);};
      tx.onerror=tx.onabort=function(){db.close();rej(tx.error||new Error('not saved'));};
    };
  });
}
function phLoad(){
  if(PH.loading)return;
  PH.loading=true;
  phTx(['photos'],'readonly',function(tx){return tx.objectStore('photos').getAll();}).then(function(l){PH.list=l||[];PH.err=null;},function(e){PH.list=[];PH.err=(e&&e.message)||String(e);})
    .then(function(){PH.loading=false;if(UI.tab==='body')requestRender();});
}

/* weeks: Monday dates; Week 1 is the week of the earliest photo */

function phWeekNo(week){return Math.round((parseYmd(week)-phStartMon())/(7*86400000))+1;}
function phWeekName(week){var n=phWeekNo(week);return n>=1?'Week '+n:'Before week 1';}
function phOrder(a,b){
  if(a.week!==b.week)return a.week<b.week?-1:1;
  var d=(PH_CAT[a.pose]||PH_UNORG).n-(PH_CAT[b.pose]||PH_UNORG).n;if(d)return d;
  return a.added<b.added?-1:a.added>b.added?1:0;
}
function phOf(week,pose){return (PH.list||[]).filter(function(r){return r.week===week&&r.pose===pose;}).sort(phOrder);}
function phGet(id){return (PH.list||[]).filter(function(r){return r.id===id;})[0]||null;}

function phNewId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* a photo is kept at up to 1920 pixels on its long side (c.0.4 MB), with a thumbnail of 360 */
function phDecode(blob){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(blob),img=new Image();
    img.onload=function(){res({img:img,url:url});};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('This photo cannot be opened here. HEIC photos are not supported: set the camera to save JPEG.'));};
    img.src=url;

}
function phEncode(img,max,q){
  var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h)),cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));

  var g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(img,0,0,cw,ch);

}
/* keep: the file is stored as it is (a photo of this app's own zip) and only the thumbnail is made */

    return full.then(function(f){

    var old=pose==='unorg'?null:(phOf(week,pose)[0]||null);
    return phTx(['photos','files'],'readwrite',function(tx){

/* to a pose that already has a photo that week: the two swap places */

    PH.list=PH.list.filter(function(r){return r.id!==id;});

function phPendSave(t){try{localStorage.setItem(PH_PEND,JSON.stringify({at:Date.now(),week:t.week,pose:t.pose}));}catch(e){}}

/* the zip: photos.json and one folder a week, "Week 01 (23-Nov-26)/1 Front relaxed.jpg" */
function phFileName(r,k){
  var c=PH_CAT[r.pose]||PH_UNORG,w=phWeekNo(r.week);
  return 'Week '+(w>=1?pad(w):'00')+' ('+fmtDate(parseYmd(r.week))+')/'+c.n+' '+c.file+(r.pose==='unorg'?' '+k:'')+'.jpg';
}
function phZipSave(){
  var list=(PH.list||[]).slice().sort(phOrder);
  if(!list.length){toast('No photos yet.');return;}
  if(PH.busy)return;
  PH.busy=true;toast('Making the zip',60000);
  var files=[],man={app:APP_ID,kind:'photos',version:APP_VERSION,exportedAt:new Date().toISOString(),photos:[]},un={},i=0;
  function next(){
    if(i>=list.length)return Promise.resolve();

    return phFile(r.id).then(function(b){
      if(!b)return;
      if(r.pose==='unorg')un[r.week]=(un[r.week]||0)+1;
      var name=phFileName(r,un[r.week]||0);
      return b.arrayBuffer().then(function(ab){
        files.push({name:name,data:new Uint8Array(ab)});
        man.photos.push({id:r.id,file:name,week:r.week,pose:r.pose,added:r.added,taken:r.taken||null,w:r.w,h:r.h});
      });
    }).then(next);
  }
  next().then(function(){
    files.unshift({name:'photos.json',data:new TextEncoder().encode(JSON.stringify(man,null,1))});
    downloadBlob(zipStore(files),'progress-photos-'+todayY()+'.zip');
    setMeta({lastPhotoZip:man.exportedAt});
    toast('Zip saved with '+man.photos.length+(man.photos.length===1?' photo':' photos'),3000);
  },function(e){toast('Could not make the zip: '+((e&&e.message)||e),5000);}).then(function(){PH.busy=false;render();});
}

function phInflate(ent){
  if(ent.method===0)return Promise.resolve(ent.data);

    return new Response(new Blob([ent.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(ab){return new Uint8Array(ab);});

function phZipLoad(file){
  if(PH.list===null||PH.busy){toast('Photos are still loading. Try again in a moment.',3000);return;}
  PH.busy=true;toast('Reading the zip',60000);
  file.arrayBuffer().then(function(buf){
    var ents=phUnzip(buf),mf=ents['photos.json'];
    if(!mf)throw new Error('This zip has no photos.json, so it was not saved by this app.');
    return phInflate(mf).then(function(u){
      var man=null;try{man=JSON.parse(new TextDecoder().decode(u));}catch(x){}
      if(!man||man.kind!=='photos'||!Array.isArray(man.photos))throw new Error('This zip was not saved by this app.');
      var have={},s={added:0,skipped:0,unorg:0,bad:0},i=0,list=man.photos;
      PH.list.forEach(function(r){have[r.id]=1;});
      function next(){
        if(i>=list.length)return s;
        var p=list[i++];
        if(list.length>1)toast('Loading photo '+i+' of '+list.length,60000);
        if(!p||typeof p.id!=='string'||!/^[A-Za-z0-9_-]{1,40}$/.test(p.id)||!/^\d{4}-\d{2}-\d{2}$/.test(p.week||'')||!PH_CAT[p.pose]||!ents[p.file]){s.bad++;return next();}
        if(have[p.id]){s.skipped++;return next();}
        return phInflate(ents[p.file]).then(function(data){
          var week=ymd(mondayOf(parseYmd(p.week))),pose=p.pose;
          if(pose!=='unorg'&&phOf(week,pose).length){pose='unorg';s.unorg++;}
          return phPrepare(new Blob([data],{type:'image/jpeg'}),true).then(function(q){
            var rec={id:p.id,week:week,pose:pose,added:typeof p.added==='string'?p.added:new Date().toISOString(),taken:typeof p.taken==='string'?p.taken:null,w:q.w,h:q.h,size:q.blob.size,thumb:q.thumb};
            return phTx(['photos','files'],'readwrite',function(tx){tx.objectStore('files').put(q.blob,rec.id);tx.objectStore('photos').put(rec);}).then(function(){PH.list.push(rec);have[rec.id]=1;s.added++;});
          });
        }).catch(function(){s.bad++;}).then(next);
      }
      return next();
    });
  }).then(function(s){
    requestPersist();
    var m=s.added+(s.added===1?' photo loaded':' photos loaded');
    if(s.skipped)m+=', '+s.skipped+' already here';
    if(s.unorg)m+=', '+s.unorg+' put in Unorganized because the pose already had a photo that week';
    if(s.bad)m+=', '+s.bad+' could not be read';
    toast(m,6000);
  },function(e){toast((e&&e.message)||'Could not read the zip.',5000);}).then(function(){PH.busy=false;render();});
}

/* ---------- Market: the food table, and cooked weights (1.3.0) ----------
   foods-v1.json (next to index.html, kept by the service worker in a cache of its own, cfl-data) holds c.1,000 everyday
   foods bought without a label: c.900 from the French national food table (ANSES Ciqual 2025, values per 100 g) and the
   131 products of the Lidl Romania bakery sheet (Mar-25). Each food has English and Romanian search words; raw meat and
   fish have a kind, for a typical cooked ratio. A changed table gets a new file name (foods-v2.json), as the models do.
   The Market view (third view of the Food tab) browses and searches them; Copy to Ingredients makes an editable copy;
   Add ingredient in a meal finds them below Casian's own ingredients, marked Market.
   Cooked weights: ratio = cooked weight / raw weight of a batch, weighed once (100 g raw pasta giving 250 g: x2.50);
   every value per 100 g cooked is the raw value divided by the ratio, since cooking water adds weight but no nutrients.
   The batch is saved with the ingredient (cook: raw, cooked, at, and kind for meat or fish) or, for a Market food, in
   the settings (cookM); a new batch replaces it. Meat and fish never weighed raw can use a typical ratio for their kind
   and the way they were cooked, marked approximate: the ratios come from the protein kept between raw and cooked forms
   of the same cuts in Ciqual 2025 (claude/app/data/cook_ratios.py), and can easily be off by 10% (cut, fat, doneness). */
var MK={data:null,loading:false,err:null,byId:{},grpName:{},tok:[],ntok:[],htok:[]},MK_FILE='foods-v1.json';
UI.mkQ='';UI.mkGrp=null;UI.mkSel=null;UI.cook=null;

var COOK_KINDS=[
  {id:'chicken-breast',name:'Chicken breast',r:{pan:0.78,oven:0.70,boil:0.78,braise:0.70}},
  {id:'chicken-leg',name:'Chicken leg or thigh',r:{pan:0.72,oven:0.72,boil:0.72,braise:0.70}},
  {id:'turkey-breast',name:'Turkey breast',r:{pan:0.83,oven:0.78,boil:0.78,braise:0.72}},
  {id:'beef-minced',name:'Minced beef',r:{pan:0.81,oven:0.78,boil:0.80,braise:0.78}},
  {id:'beef-steak',name:'Beef or veal steak',r:{pan:0.80,oven:0.78,boil:0.70,braise:0.62}},
  {id:'beef-stew',name:'Beef or veal for stew',r:{pan:0.75,oven:0.70,boil:0.62,braise:0.58}},
  {id:'pork-chop',name:'Pork chop or loin',r:{pan:0.67,oven:0.73,boil:0.70,braise:0.65}},
  {id:'pork-shoulder',name:'Pork shoulder or belly',r:{pan:0.68,oven:0.63,boil:0.63,braise:0.60}},
  {id:'pork-minced',name:'Minced pork and mici',r:{pan:0.75,oven:0.73,boil:0.75,braise:0.73}},
  {id:'lamb',name:'Lamb',r:{pan:0.72,oven:0.77,boil:0.62,braise:0.57}},
  {id:'fish-fat',name:'Oily fish (salmon, trout, mackerel)',r:{pan:0.80,oven:0.86,boil:0.86,braise:0.85}},
  {id:'fish-white',name:'White fish (cod, hake, pollock)',r:{pan:0.81,oven:0.81,boil:0.79,braise:0.83}}
];
var COOK_KIND={},COOK_METHOD={};

function mkNorm(s){return stripDia(String(s||'')).toLowerCase();}
function mkWords(s){return mkNorm(s).split(/[^a-z0-9%]+/).filter(Boolean);}
function mkLoad(){
  if(MK.data||MK.loading)return;
  MK.loading=true;MK.err=null;
  fetch(MK_FILE).then(function(r){if(!r.ok)throw new Error('the file '+MK_FILE+' is missing ('+r.status+')');return r.json();}).then(function(d){
    MK.byId={};MK.grpName={};
    d.groups.forEach(function(g){MK.grpName[g.id]=g.name;});
    MK.tok=d.foods.map(function(f){MK.byId[f.id]=f;return mkWords(f.n+' '+(f.k||'')+' '+(f.like||''));});
    MK.ntok=d.foods.map(function(f){return mkWords(f.n);});
    /* head words: the English first part of the name (Lidl: its first word) and the first word of each Romanian
       translation of it count most; the other words of those translations next */
    MK.htok=d.foods.map(function(f){
      var a=mkWords(f.g==='lidl'?f.n.split(/\s+/)[0]:f.n.split(',')[0]),b=[];
      (f.h||'').split(';').forEach(function(v){var w=mkWords(v);if(w.length){a.push(w[0]);b=b.concat(w.slice(1));}});
      return [a,b];
    });
    MK.data=d;
  },function(e){MK.err=(e&&e.message)||String(e);}).then(function(){
    MK.loading=false;
    var a=document.getElementById('inglist'),b=document.getElementById('mkrows');
    if(a)a.innerHTML=ingOptions();
    if(UI.tab==='food'&&UI.foodView==='market'&&!b)requestRender();else if(b)b.innerHTML=mkRowsHtml();
  });
}
/* every word typed must start a word of the food's name, its Romanian words or its similar product */
function mkSearch(q,grp,limit){
  if(!MK.data)return [];
  var ws=mkWords(q),F=MK.data.foods,out=[];
  for(var i=0;i<F.length;i++){
    var f=F[i];if(grp&&f.g!==grp)continue;
    if(!ws.length){out.push([0,f]);continue;}
    var tk=MK.tok[i],ok=true;
    for(var j=0;j<ws.length&&ok;j++){var hit=false;for(var t=0;t<tk.length;t++){if(tk[t].indexOf(ws[j])===0){hit=true;break;}}ok=hit;}
    if(!ok)continue;
    var nt=MK.ntok[i],ha=MK.htok[i][0],hb=MK.htok[i][1],sc=0,w0=ws[0];
    if(ha.some(function(t){return t.indexOf(w0)===0;}))sc+=4;else if(hb.some(function(t){return t.indexOf(w0)===0;}))sc+=3;
    if(ha.some(function(t){return t===w0;})||hb.some(function(t){return t===w0;}))sc+=1;
    ws.forEach(function(w){if(nt.some(function(t){return t.indexOf(w)===0;}))sc+=1;});
    if(/, raw\b|\(average\)/.test(f.n))sc+=0.5;
    out.push([sc-f.n.length/200,f]);
  }
  if(ws.length)out.sort(function(a,b){return b[0]-a[0];});else out.sort(function(a,b){return a[1].n.localeCompare(b[1].n);});
  return out.slice(0,limit||out.length).map(function(x){return x[1];});
}
/* a Market food as an ingredient (values per 100 g; missing values stay empty) */
function mkIng(f){
  var v=f.v;
  return {name:f.n,basis:'g',kcal:v[0],p:v[1],c:v[2],f:v[3],sat:v[4],sugar:v[5],fibre:v[6],salt:v[7],micros:f.m||{},market:f.id,kind:f.kind||null};
}
function pickIng(id){
  if(!id)return null;
  if(id.indexOf('mk:')===0){var f=MK.byId[id.slice(3)];return f?mkIng(f):null;}
  if(id.indexOf('rc:')===0){var r=S.recipes[id.slice(3)];return r?rcPer100(r,id.slice(3)):null;}
  return S.ingredients[id]||null;
}
function per100v(v){return fmtInt(v[0])+' kcal, P '+fmtG(v[1])+', C '+fmtG(v[2])+', F '+fmtG(v[3]);}
function fmtR(r){return (Math.round(r*100)/100).toFixed(2);}

/* cooked weights */
function cookMeasured(id){
  var c=null;
  if(id&&id.indexOf('mk:')===0)c=S.settings&&S.settings.cookM&&S.settings.cookM[id.slice(3)];
  else if(id&&S.ingredients[id])c=S.ingredients[id].cook;
  return c&&c.raw>0&&c.cooked>0?c:null;
}
function cookKindOf(id){
  if(!id)return null;
  if(id.indexOf('mk:')===0){var f=MK.byId[id.slice(3)];return (f&&f.kind)||null;}
  var x=S.ingredients[id];return (x&&x.cook&&x.cook.kind)||null;
}
function cookedVals(ing,r){
  var o={name:ing.name,basis:ing.basis,micros:{}};
  LABEL.forEach(function(l){var v=ing[l.k];o[l.k]=(v==null||v==='')?null:(+v)/r;});
  Object.keys(ing.micros||{}).forEach(function(m){o.micros[m]=(+ing.micros[m])/r;});
  return o;

/* the ratio the picker uses now: a batch being entered, the saved batch, or a typical ratio for meat and fish */
function cookRatio(id){
  var c=UI.cook||{},br=num(c.braw),bc=num(c.bcooked);
  if(br>0&&bc>0)return {r:bc/br,src:'batch',approx:false};
  var m=cookMeasured(id);
  if(m&&!c.batch)return {r:m.cooked/m.raw,src:'saved',approx:false};
  var k=c.kind||cookKindOf(id);
  if(!m&&k&&COOK_KIND[k]&&c.method)return {r:COOK_KIND[k].r[c.method],src:'typical',approx:true,kind:k,method:c.method};
  return null;
}
function cookRatioText(id){
  var cr=cookRatio(id),k=(UI.cook&&UI.cook.kind)||cookKindOf(id);

  return (cr.approx?'Typical ratio for '+COOK_KIND[cr.kind].name.toLowerCase()+', '+COOK_METHOD[cr.method].name.toLowerCase()+': x'+fmtR(cr.r)+', approximate':'Ratio x'+fmtR(cr.r))+'. 100 g raw makes '+fmtG(100*cr.r)+' g cooked.';
}
function cookSave(id,c){

   Weight: entries {d: 'YYYY-MM-DD', kg} in the document body/weights, part of the backup file (unlike the photos).

S.body=S.body||{weights:[]};

function wtStats(){
  var l=wtList();if(!l.length)return null;
  var last=l[l.length-1],t=parseYmd(last.d),day=function(n){return ymd(addDays(t,n));};
  var wk=wtAvg(l,day(-6),last.d),prev=wtAvg(l,day(-13),day(-7)),m4=wtAvg(l,day(-34),day(-28));
  return {last:last,first:l[0],n:l.length,week:wk,prevWeek:prev,change:wk!=null&&prev!=null?wk-prev:null,
    perWeek:wk!=null&&m4!=null?(wk-m4)/4:null,total:last.kg-l[0].kg,days:Math.round((t-parseYmd(l[0].d))/86400000)};
}
function signed(v,dec){var x=Math.abs(v)<0.05?0:v;return (x>0?'+':'')+x.toFixed(dec==null?1:dec);}
function wtChartSvg(){
  var l=wtList();if(l.length<2)return '';
  var end=parseYmd(l[l.length-1].d),start=addDays(end,-83),pts=l.filter(function(x){return parseYmd(x.d)>=start;});
  if(pts.length<2)pts=l.slice(-2);
  var t0=parseYmd(pts[0].d),span=Math.max(1,(end-t0)/86400000),lo=Infinity,hi=-Infinity;
  pts.forEach(function(x){lo=Math.min(lo,x.kg);hi=Math.max(hi,x.kg);});
  var pad=Math.max(0.5,(hi-lo)*0.15);lo-=pad;hi+=pad;
  var W=320,H=150,L=34,R=8,T=10,B=22,X=function(d){return L+(W-L-R)*((parseYmd(d)-t0)/86400000)/span;},Y=function(v){return T+(H-T-B)*(hi-v)/(hi-lo);};
  var avg=pts.map(function(x){var a=wtAvg(l,ymd(addDays(parseYmd(x.d),-6)),x.d);return [X(x.d),Y(a)];});
  var h='<svg class="wt-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight over the last weeks">';
  [lo+pad,(lo+hi)/2,hi-pad].forEach(function(v){h+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" class="grid"/><text x="'+(L-4)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end">'+v.toFixed(1)+'</text>';});
  h+='<text x="'+L+'" y="'+(H-6)+'">'+esc(fmtDM(t0))+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+esc(fmtDM(end))+'</text>';
  h+='<polyline class="avg" points="'+avg.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>';
  pts.forEach(function(x){h+='<circle cx="'+X(x.d).toFixed(1)+'" cy="'+Y(x.kg).toFixed(1)+'" r="2.6"/>';});
  return h+'</svg><div class="wt-legend"><span><i class="dot"></i>Weigh-ins</span><span><i class="ln"></i>7-day average</span></div>';
}

/* ---------- Recipes (1.3.1): own dishes built from ingredients and Market foods ----------
   A recipe (document recipes/<id>, in the backup) holds its items {ref, name, g, v}: ref is an own ingredient's id or
   mk:<Market id>, g the grams put in, v the values per 100 g when the item was added (used only when the source is
   gone). Values per 100 g = the sum of the items' values divided by the weight of the finished dish when it was weighed
   (baking and cooking lose or gain water), else by the sum of the grams; pieces give a piece weight. A recipe is found
   in Add ingredient (marked Recipe) and logged as an item with rc: its id; meals keep the values they were logged with. */
S.recipes=S.recipes||{};UI.rcForm=null;
function rcSrc(it){var x=pickIng(it.ref);return x||it.v||null;}
function rcTotals(r){
  var tot={micros:{}},raw=0,miss=0;
  LABEL.forEach(function(l){tot[l.k]=0;});
  (r.items||[]).forEach(function(it){
    var g=num(it.g);if(!(g>0))return;raw+=g;
    var x=rcSrc(it);if(!x){miss++;return;}
    var v=scale(x,g);
    LABEL.forEach(function(l){tot[l.k]+=v[l.k]||0;});
    Object.keys(v.micros||{}).forEach(function(m){tot.micros[m]=(tot.micros[m]||0)+v.micros[m];});
  });
  var ck=num(r.cooked);
  return {tot:tot,raw:raw,w:ck>0?ck:raw,miss:miss};
}
function rcPer100(r,id){
  var t=rcTotals(r);if(!(t.w>0))return null;

   "Authorization: ApiKey <key>"; the token is the response text, a JWT), which reads the data (Authorization: Bearer).
   Host and paths from Garmin's own client, github.com/garmin/connect-personal-api-python. The key and the token stay in
   this phone's localStorage, never in the backup file. The data (activities, sleep, HRV, resting heart rate) lives in a
   database of its own (casian-fitness-log-garmin) and is read without a connection; a sync runs only while Chrome reports
   Wi-Fi (navigator.connection.type), when the app opens or comes back, when the phone joins Wi-Fi (30 minutes at least
   between automatic syncs) and with Sync now. Garmin's answers are read loosely (fields looked for anywhere in the reply),
   since only the paths are documented; the last sync's replies, cut short and without key or token, make the Garmin report. */

  if(k==='net')return 'Garmin did not answer. If the phone is online, Garmin is refusing calls from a web app like this one; the way round it is intervals.icu.';
  if(k==='rate')return 'Garmin asked the app to slow down; the next sync will try again.';

function gmActs(from,to){var d=GM.data;return Object.keys(d.acts).map(function(k){return d.acts[k];}).filter(function(a){return a.date>=from&&a.date<=to;}).sort(function(a,b){return a.date+a.time<b.date+b.time?-1:1;});}

function gmLoadOf(a){
  var min=(a.dur||0)/60;if(!(min>0))return {v:0,est:false};
  if(a.rpe!=null)return {v:a.rpe*min,est:false};

  if(tz>0)return {v:a.zones.reduce(function(s,z,i){return s+z*GM_ZONE_RPE[i];},0)/tz*min,est:true};

function gmSpeedKmh(a){
  if(!(a.moving>0))return null;
  var w=a.dist>0?a.dist/a.moving*3.6:(a.speed?a.speed*3.6:null);if(!w)return null;
  if(lsGet(GM_LS.tread)!=='figures'||!/treadmill|indoor/.test(a.type))return w;

  if(w<=P[0][0])return P[0][1]-(P[0][0]-w);
  for(var i=1;i<P.length;i++)if(w<=P[i][0])return P[i-1][1]+(w-P[i-1][0])*(P[i][1]-P[i-1][1])/(P[i][0]-P[i-1][0]);

  var el=document.getElementById('gm-key'),k=el?el.value.trim():'';
  if(k.length<10){toast('Paste the key from Garmin Connect',3000);return;}
  lsSet(GM_LS.key,k);lsSet(GM_LS.tok,null);lsSet(GM_LS.until,ymd(addDays(new Date(),+UI.gmValid||365)));
  GM.err=null;GM.test=null;toast('Garmin key saved on this phone',2500);render();
  if(gmWifi()===true)gmSync(false);
};
ACT['gm-sync']=function(){gmSync(true);};
ACT['gm-test']=function(){
  if(gmWifi()===false){toast('Connect to Wi-Fi first: the app talks to Garmin only on Wi-Fi',3500);return;}
  GM.test='Testing...';render();
  gmToken(true).then(function(t){return gmGet('/activitylist-service/activities/search/activities',{start:0,limit:1},t);}).then(function(j){
    var n=(Array.isArray(j)?j:(j&&(j.activityList||j.activities))||[]).length;
    GM.test='Connected: Garmin answered'+(n?' and sent your latest activity.':'.');GM.err=null;
  },function(e){GM.test=null;GM.err=gmErrText(e);}).then(function(){render();});
};
ACT['gm-report']=function(){
  var r=GM.report;if(!r){toast('No sync yet to report on',3000);return;}
  downloadBlob(new Blob([JSON.stringify(r,null,1)],{type:'application/json'}),'garmin-report-'+todayY()+'.json');
};
ACT['gm-forget']=function(){UI.gmForget=true;render();};
ACT['gm-forget-no']=function(){UI.gmForget=false;render();};
ACT['gm-forget-yes']=function(){
  UI.gmForget=false;lsSet(GM_LS.key,null);lsSet(GM_LS.tok,null);lsSet(GM_LS.until,null);GM.test=null;GM.err=null;toast('Garmin key removed from this phone');render();
};
INPUT.gmvalid=function(t){UI.gmValid=t.value;};
INPUT.gmtread=function(t){lsSet(GM_LS.tread,t.value==='figures'?'figures':null);render();};

/* ---------- start ---------- */
window.CFL={parseLabel:parseLabel,gm:{sync:function(m){return gmSync(!!m);},age:function(ms){if(GM.data)GM.data.synced-=ms;},state:function(){return {busy:GM.busy,err:GM.err,counts:GM.data?gmCounts():null,synced:GM.data&&GM.data.synced,test:GM.test};}},rcPer100:function(id){return rcPer100(S.recipes[id],id);},mkSearch:function(q,g,n){return mkSearch(q,g,n).map(function(f){return f.n;});},mkReady:function(){return !!MK.data;},cookKinds:COOK_KINDS,PLAN_V2:PLAN_V2,PLAN_V3:PLAN_V3,PLAN_V4:PLAN_V4,version:APP_VERSION,
  photos:function(){return (PH.list||[]).slice().sort(phOrder).map(function(r){return {id:r.id,week:r.week,pose:r.pose,w:r.w,h:r.h,size:r.size,thumb:r.thumb?r.thumb.size:0,weekName:phWeekName(r.week)};});}};
render();
openIdb().then(function(h){
  KV=h?idbKV(h):(lsWorks()?lsKV():memKV());
  return KV.all();
}).then(function(all){
  S.storeState=KV.kind==='mem'?'memory':'ok';loadDocs(all);migrate();var back=pendRestore(),phBack=back?(phPendClear(),null):phPendRestore();render();requestPersist();setTimeout(gmLoad,1200);
  if(phBack)toast('The phone closed the app while the camera was open, so the photo did not arrive. Tap '+(PH_CAT[phBack.pose]||PH_UNORG).name+' to take it again.',7000);
  if(back)toast('The phone closed the app while the camera was open. Your ingredient is back: tap Scan label to take the photo again.',7000);
}).catch(function(){
  KV=memKV();S.storeState='memory';loadDocs({});render();
});
})();
</script>
